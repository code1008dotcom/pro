    }

    :root {
      --bg: #000000;
      --text: #ffffff;
      --card: #1c1c1e;
      --card-light: #2c2c2e;
      --border: #38383a;
      --accent: #0a84ff;
      --secondary-text: #8e8e93;
      --logo: #ffffff;
      --banner-bg: #0a84ff;
      --banner-text: #ffffff;
      --success: #30d158;
      --warning: #ff9f0a;
      --danger: #ff453a;
      --tab-bar: #0c0c0d;
      --input-bg: #1c1c1e;
    }

    .light {
      --bg: #ffffff;
      --text: #000000;
      --card: #f2f2f7;
      --card-light: #e5e5ea;
      --border: #d1d1d6;
      --accent: #007aff;
      --secondary-text: #8e8e93;
      --logo: #000000;
      --banner-bg: #007aff;
      --banner-text: #ffffff;
      --tab-bar: #f2f2f7;
      --input-bg: #e5e5ea;
    }

    body {
      background: var(--bg);
      color: var(--text);
      transition: background 0.2s, color 0.2s;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0 0 70px 0;
    }

    #app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* top banner */
    .top-banner {
      background: var(--banner-bg);
      color: var(--banner-text);
      padding: 10px 16px;
      font-size: 13px;
      text-align: center;
      font-weight: 500;
      white-space: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      letter-spacing: 0.2px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .top-banner::-webkit-scrollbar {
      display: none;
    }

    .top-banner span {
      margin: 0 8px;
      opacity: 0.9;
    }

    /* main scroll area */
    .screen-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px 16px 20px;
    }

    /* logo */
    .logo {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -2px;
      color: var(--logo);
      line-height: 1;
      margin-bottom: 8px;
      user-select: none;
    }

    .logo-small {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--logo);
    }

    /* typography */
    h1 {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 16px;
      color: var(--secondary-text);
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .secondary {
      color: var(--secondary-text);
      font-size: 14px;
    }

    /* buttons */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      background: var(--accent);
      color: #fff;
      margin-bottom: 10px;
    }

    .btn:active {
      opacity: 0.8;
      transform: scale(0.98);
    }

    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--accent);
      color: var(--accent);
    }

    .btn-sm {
      padding: 10px 16px;
      font-size: 15px;
      width: auto;
      border-radius: 20px;
    }

    /* inputs */
    input, select, textarea {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
      transition: border 0.2s;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }

    ::placeholder {
      color: var(--secondary-text);
    }

    label {
      font-size: 14px;
      font-weight: 500;
      color: var(--secondary-text);
      margin-bottom: 6px;
      display: block;
    }

    /* cards */
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--accent);
      color: #fff;
    }

    .badge-green {
      background: var(--success);
      color: #000;
    }

    .badge-orange {
      background: var(--warning);
      color: #000;
    }

    .badge-grey {
      background: var(--secondary-text);
      color: #fff;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--card-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      color: var(--text);
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .avatar-sm {
      width: 36px;
      height: 36px;
      font-size: 14px;
    }

    .avatar-lg {
      width: 72px;
      height: 72px;
      font-size: 26px;
    }

    /* identity */
    .identity-code {
      font-family: 'SF Mono', 'Menlo', monospace;
      font-size: 13px;
      letter-spacing: 0.5px;
      color: var(--accent);
      font-weight: 600;
    }

    /* tab bar */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: var(--tab-bar);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 0 12px;
      z-index: 30;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: var(--secondary-text);
      cursor: pointer;
      padding: 4px 8px;
      transition: color 0.2s;
      border: none;
      background: none;
    }

    .tab-item.active {
      color: var(--accent);
    }

    .tab-icon {
      font-size: 22px;
      line-height: 1;
    }

    /* floating support */
    .support-btn {
      position: fixed;
      bottom: 80px;
      right: calc(50% - 240px + 16px);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      cursor: pointer;
      z-index: 25;
      border: none;
    }

    @media (max-width: 480px) {
      .support-btn {
        right: 16px;
      }

    /* chats */
    .chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .chat-item:last-child {

    }

    .chat-info {

      min-width: 0;
    }

    .chat-name {

      font-size: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;

    }

    .flex-col {
      flex-direction: column;
    }

    .items-center {
      align-items: center;
    }

    .justify-between {

  </style>

  // ---------- HELPERS ----------
  function applyTheme() {

    if (toggle) toggle.textContent = theme === 'dark' ? '☀️' : '🌙';

  function toggleTheme() {
    theme = theme === 'dark' ? 'light' : 'dark';
    applyTheme();
    renderScreen();

  function showToast(msg) {
    const t = document.createElement('div');
    t.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:12px 24px;border-radius:24px;font-size:14px;z-index:999;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,0.3);';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2000);
  }

      tabBar.classList.add('hidden');
      supportBtn.classList.add('hidden');

      tabBar.classList.remove('hidden');
      supportBtn.classList.remove('hidden');
    }

    switch (currentScreen) {
      case 'welcome':
        container.innerHTML = renderWelcome();
        break;
      case 'email':
        container.innerHTML = renderEmail();
        break;
      case 'otp':
        container.innerHTML = renderOTP();
        break;
      case 'identity':
        container.innerHTML = renderIdentity();
        break;
      case 'profile-setup':
        container.innerHTML = renderProfileSetup();
        break;

  function completeProfile() {
    const alias = document.getElementById('aliasInput')?.value?.trim();
    const bio = document.getElementById('bioInput')?.value?.trim();
    const country = document.getElementById('countryInput')?.value?.trim();
    const skills = document.getElementById('skillsInput')?.value?.split(',').map(s => s.trim()).filter(Boolean);
    const lang = document.getElementById('langInput')?.value?.trim();
    const email = document.getElementById('emailProfileInput')?.value?.trim();

    if (alias) currentUser.name = alias;
    if (bio) currentUser.bio = bio;
    if (country) currentUser.country = country;
    if (skills && skills.length) currentUser.skills = skills;
    if (lang) currentUser.lang = lang;
    if (email) currentUser.email = email;

    // regenerate identity code based on type
    if (currentUser.type === 'skillman') {
      const idx = skillMen.findIndex(s => s.alias === currentUser.alias);
      if (idx >= 0) {
        const num = String(idx + 1).padStart(2, '0');
        currentUser.alias = `SKILLMAN<>${num}`;
        currentUser.code = currentUser.alias;
      }
    } else {
      // Real World 9-digit code
      const base = 100000000;
      const rand = Math.floor(Math.random() * 900) + 100;
      currentUser.code = String(base + rand);
      currentUser.alias = `REAL<>${currentUser.code.slice(-4)}`;
    }

    currentScreen = 'main';
    activeTab = 'home';
    renderScreen();
    showToast('Identity created!');
  }

  function claimTask(taskId) {
    const task = tasks.find(t => t.id === taskId);

      task.assignedTo = currentUser.alias;
      renderScreen();
      showToast('Task claimed!');

    const task = tasks.find(t => t.id === taskId);
    if (task && task.status === 'locked' && task.assignedTo === currentUser.alias) {
      task.status = 'completed';
      renderScreen();
      showToast('Task completed! Reward released.');
    }
  }

  function failTask(taskId) {
    const task = tasks.find(t => t.id === taskId);
    if (task && task.status === 'locked' && task.assignedTo === currentUser.alias) {
      task.status = 'open';
      task.assignedTo = null;
      renderScreen();
      showToast('Task reopened.');

            <div class="flex justify-between items-center">
              <div>
                <p style="font-weight:600;">${c.name}</p>
                <p class="secondary" style="font-size:13px;">${c.members} members · ${c.desc}</p>
              </div>
              <span class="badge ${c.type === 'Private' ? 'badge-orange' : 'badge-green'}" style="font-size:10px;">${c.type}</span>
            </div>
          </div>
        `).join('')}

        <div class="card mt-8" style="text-align:center;border:1px dashed var(--border);">
          <p class="secondary" style="font-size:13px;">Voice Rooms · Video Rooms · Announcements</p>
        </div>
      </div>
    `;
  }

  // ---------- PROFILE ----------
  function renderProfile() {
    const isSkill = currentUser.type === 'skillman';
    return `
      <div>
        <div class="flex justify-between items-center mb-16">
          <h2>Profile</h2>
          <div class="theme-toggle" onclick="toggleTheme()" id="themeToggle">${theme === 'dark' ? '☀️' : '🌙'}</div>
        </div>

        <div class="profile-header">
          <div class="avatar avatar-lg">${currentUser.name ? currentUser.name[0] : '?'}</div>
          <div>
            <h3 style="margin-bottom:2px;">${currentUser.name || 'User'}</h3>
            <p class="identity-code">${currentUser.alias || currentUser.code}</p>
            <span class="badge ${isSkill ? '' : 'badge-grey'}" style="margin-top:4px;">${currentUser.badge}</span>
          </div>
        </div>

        <div class="card">
          <p class="secondary" style="font-size:14px;">${currentUser.bio || 'No bio yet.'}</p>
        </div>

        <div class="card">
          <h3 class="mb-8">Skills</h3>
          <div>
            ${(currentUser.skills || ['Builder']).map(s => `<span class="tag">${s}</span>`).join('')}
          </div>
        </div>

        <div class="card">
          <h3 class="mb-8">Languages</h3>
          <p>${currentUser.lang || 'English'}</p>
        </div>

        <div class="card">
          <h3 class="mb-8">Country</h3>
          <p>${currentUser.country || 'Global'}</p>
        </div>

        <div class="card">
          <div class="profile-stats">
            <div class="stat">
              <div class="stat-value">${currentUser.completed || 0}</div>
              <div class="stat-label">Tasks Done</div>
            </div>
            <div class="stat">
              <div class="stat-value">${currentUser.successRate || 100}%</div>
              <div class="stat-label">Success Rate</div>
            </div>
            <div class="stat">
              <div class="stat-value">${isSkill ? '⭐ 4.9' : '—'}</div>
              <div class="stat-label">Reviews</div>
            </div>
          </div>
        </div>

        <button class="btn btn-secondary" onclick="logout()">Log Out</button>
      </div>
    `;
  }

  function logout() {
    currentUser = null;
    currentScreen = 'welcome';
    activeTab = 'home';
    renderScreen();
    showToast('Logged out');
  }

  // ---------- SUPPORT MODAL ----------
  function toggleSupportModal() {
    const modal = document.getElementById('supportModal');
    modal.classList.toggle('hidden');
  }

  // ---------- TAB BAR EVENTS ----------
  document.querySelectorAll('.tab-item').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!currentUser) return;
      activeTab = btn.dataset.tab;
      renderScreen();
      window.scrollTo({ top: 0 });
    });
  });

  // ---------- EMAIL / OTP SIMULATION ----------
  window.goToEmail = function() {
    currentScreen = 'email';
    renderScreen();
  };

  window.submitEmail = submitEmail;
  window.verifyOTP = verifyOTP;
  window.selectIdentity = selectIdentity;
  window.completeProfile = completeProfile;
  window.claimTask = claimTask;
  window.completeTask = completeTask;
  window.failTask = failTask;
  window.toggleTheme = toggleTheme;
  window.toggleSupportModal = toggleSupportModal;
  window.logout = logout;
  window.showToast = showToast;
  window.renderScreen = renderScreen;

  // ---------- INIT ----------
  applyTheme();
  renderScreen();
</script>
</body>
</html>
