<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0B0B0B">
<title>Code1008 — Identity by Code</title>
<style>
/* ============================================================
   CODE1008 — DESIGN SYSTEM
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0B0B0B;
  --card:#151515;
  --card2:#1E1E1E;
  --line:#262626;
  --gold:#D4AF37;
  --gold-dim:#a8862a;
  --gold-soft:rgba(212,175,55,.13);
  --text:#FFFFFF;
  --muted:#8B8B8B;
  --mine:#D4AF37;
  --mine-text:#0B0B0B;
  --green:#39D98A;
  --red:#FF5C5C;
  --shadow:0 10px 40px rgba(0,0,0,.55);
  --r:16px;
}
body.light{
  --bg:#F5F5F7;
  --card:#FFFFFF;
  --card2:#EFEFF2;
  --line:#E4E4EA;
  --text:#0B0B0B;
  --muted:#7A7A85;
  --gold-soft:rgba(212,175,55,.18);
  --shadow:0 10px 40px rgba(0,0,0,.10);
}
html,body{height:100%}
body{
  background:#000;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;justify-content:center;
  overflow:hidden;
  transition:background .3s;
}
body.light{background:#DEDEE3}
::-webkit-scrollbar{width:0;height:0}
input,button,textarea{font:inherit;color:inherit;outline:none;border:none;background:none}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- APP SHELL ---------- */
#app{
  position:relative;
  width:100%;max-width:480px;height:100dvh;
  background:var(--bg);
  overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 0 80px rgba(0,0,0,.6);
}
.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  background:var(--bg);
}
.ic svg{width:22px;height:22px;display:block}
.icon-btn{
  width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;
  color:var(--text);opacity:.9;
  transition:background .18s,transform .12s,opacity .18s;
}
.icon-btn:hover{background:var(--card2);opacity:1}
.icon-btn:active{transform:scale(.9)}

/* ---------- AUTH ---------- */
#authScreen{
  justify-content:center;align-items:center;padding:28px;
  background:
    radial-gradient(700px 420px at 50% -10%,rgba(212,175,55,.14),transparent 60%),
    var(--bg);
  overflow-y:auto;
}
.auth-wrap{width:100%;max-width:380px;animation:fadeUp .6s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.brand-big{
  font-size:34px;font-weight:800;letter-spacing:6px;text-align:center;
  color:var(--text);
}
.brand-big span{color:var(--gold)}
.brand-sub{
  text-align:center;color:var(--muted);font-size:13.5px;margin-top:10px;
  letter-spacing:.3px;line-height:1.6;
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:22px;
  margin-top:26px;
  box-shadow:var(--shadow);
}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;letter-spacing:1.4px;color:var(--muted);margin-bottom:8px;text-transform:uppercase}
.input{
  width:100%;background:var(--card2);
  border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;font-size:15px;
  transition:border-color .2s,background .2s;
}
.input:focus{border-color:var(--gold);background:var(--gold-soft)}
.btn{
  width:100%;padding:15px;border-radius:12px;
  background:var(--gold);color:#0B0B0B;font-weight:700;
  font-size:15px;letter-spacing:.4px;
  transition:transform .12s,filter .2s,opacity .2s;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600}
.btn.ghost:hover{background:var(--card2)}
.btn.small{padding:10px 16px;width:auto;font-size:13px;border-radius:10px}
.code-reveal{
  text-align:center;padding:22px 10px;
  border:1px dashed rgba(212,175,55,.4);
  border-radius:14px;background:var(--gold-soft);
  margin-bottom:18px;
}
.code-reveal .cl{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.code-reveal .cv{font-size:34px;font-weight:800;color:var(--gold);font-family:ui-monospace,Menlo,monospace;margin-top:8px}
.muted{color:var(--muted);font-size:12.5px;line-height:1.6}
.center{text-align:center}

/* ---------- TOP BAR ---------- */
#topbar{
  height:58px;flex:none;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 10px 0 18px;
  border-bottom:1px solid var(--line);
  background:var(--bg);
  z-index:5;
}
.brand{font-size:17px;font-weight:800;letter-spacing:3.4px}
.brand span{color:var(--gold)}
.tb-actions{display:flex;gap:2px}

/* ---------- TAB BAR ---------- */
#tabbar{
  height:66px;flex:none;
  display:grid;grid-template-columns:repeat(5,1fr);
  border-top:1px solid var(--line);
  background:var(--bg);
  padding-bottom:env(safe-area-inset-bottom);
}
#tabbar button{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--muted);font-size:10px;letter-spacing:.4px;font-weight:600;
  transition:color .2s,transform .15s;position:relative;
}
#tabbar button:active{transform:scale(.9)}
#tabbar button.active{color:var(--gold)}
#tabbar button.active::after{
  content:"";position:absolute;top:0;width:22px;height:2px;border-radius:2px;background:var(--gold);
}

/* ---------- VIEWS ---------- */
#views{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:14px;scroll-behavior:smooth}
.view-head{
  padding:18px 18px 6px;
  font-size:22px;font-weight:800;letter-spacing:.4px;
  display:flex;align-items:center;justify-content:space-between;
}
.sec-title{
  padding:16px 18px 8px;font-size:11px;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--muted);font-weight:700;
}
.empty{padding:50px 30px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.8}

/* ---------- LIST ROWS ---------- */
.row{
  display:flex;align-items:center;gap:13px;
  padding:11px 16px;cursor:pointer;
  transition:background .15s;
}
.row:hover{background:var(--card)}
.row:active{background:var(--card2)}
.av{
  width:48px;height:48px;flex:none;border-radius:50%;
  display:grid;place-items:center;
  font-size:14px;font-weight:800;letter-spacing:.5px;
  color:var(--gold);
  background:radial-gradient(circle at 30% 25%,#2a2a2a,#0e0e0e);
  border:1px solid rgba(212,175,55,.3);
  position:relative;
  user-select:none;
}
.av.sm{width:38px;height:38px;font-size:11.5px}
.av.lg{width:96px;height:96px;font-size:28px}
.av .dot{
  position:absolute;right:-1px;bottom:-1px;
  width:13px;height:13px;border-radius:50%;
  background:var(--green);border:2.5px solid var(--bg);
}
.av.group{color:#fff;background:linear-gradient(135deg,#2b2b2b,#141414);border-color:var(--line)}
.row-main{flex:1;min-width:0}
.row-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.row-name{font-size:15.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-time{font-size:11px;color:var(--muted);flex:none}
.row-bot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:3px}
.row-prev{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{
  min-width:20px;height:20px;padding:0 6px;border-radius:10px;
  background:var(--gold);color:#0B0B0B;font-size:11px;font-weight:800;
  display:grid;place-items:center;flex:none;
}
.ctag{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--gold);font-size:.86em;letter-spacing:.2px;
}
.pin-ic{color:var(--muted);display:inline-flex;vertical-align:-3px;margin-right:4px}
.pin-ic svg{width:13px;height:13px}

/* ---------- CARDS ---------- */
.card-item{
  margin:8px 14px;padding:16px;
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);
  transition:transform .15s,border-color .2s;
}
.card-item:hover{border-color:rgba(212,175,55,.35)}
.chal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.chal-title{font-size:15px;font-weight:700;line-height:1.4}
.chal-reward{color:var(--gold);font-weight:800;font-size:15px;white-space:nowrap}
.chal-desc{color:var(--muted);font-size:13px;line-height:1.6;margin-top:8px}
.chal-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.tag{
  font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;font-weight:800;
  padding:5px 10px;border-radius:20px;border:1px solid var(--line);color:var(--muted);
}
.tag.open{color:var(--gold);border-color:rgba(212,175,55,.45);background:var(--gold-soft)}
.tag.locked{color:#7fb2ff;border-color:rgba(127,178,255,.35)}
.tag.done{color:var(--green);border-color:rgba(57,217,138,.35)}
.tag.fail{color:var(--red);border-color:rgba(255,92,92,.35)}
.chal-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* ---------- SEGMENT ---------- */
.segment{
  display:flex;gap:6px;margin:10px 14px 4px;padding:5px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
}
.segment button{
  flex:1;padding:9px;border-radius:9px;font-size:13px;font-weight:700;
  color:var(--muted);transition:all .2s;
}
.segment button.active{background:var(--gold-soft);color:var(--gold)}

/* ---------- PROFILE ---------- */
.profile-hero{
  text-align:center;padding:26px 20px 20px;
  background:radial-gradient(500px 240px at 50% 0%,rgba(212,175,55,.13),transparent 70%);
}
.profile-hero .av{margin:0 auto 14px}
.profile-name{font-size:22px;font-weight:800;letter-spacing:.4px}
.profile-code{
  font-family:ui-monospace,Menlo,monospace;color:var(--gold);
  font-size:14px;margin-top:5px;letter-spacing:1px;
}
.profile-bio{color:var(--muted);font-size:13px;margin-top:12px;line-height:1.65;max-width:300px;margin-left:auto;margin-right:auto}
.btn-row{display:flex;gap:10px;padding:4px 16px 8px;flex-wrap:wrap;justify-content:center}
.btn-row .btn{width:auto;flex:1;min-width:110px;padding:12px;font-size:13.5px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px}
.info-cell{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.info-cell .k{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700}
.info-cell .v{font-size:13.5px;margin-top:7px;line-height:1.5;word-break:break-word}

/* ---------- SETTINGS ---------- */
.set-row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:15px 18px;cursor:pointer;border-bottom:1px solid var(--line);
  transition:background .15s;
}
.set-row:hover{background:var(--card)}
.set-left{display:flex;align-items:center;gap:14px;min-width:0}
.set-ic{color:var(--gold);opacity:.9;display:flex}
.set-label{font-size:14.5px}
.set-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.switch{
  width:48px;height:28px;border-radius:16px;background:var(--card2);
  border:1px solid var(--line);position:relative;flex:none;transition:background .25s,border-color .25s;
}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;
  background:var(--muted);transition:transform .25s cubic-bezier(.2,.8,.2,1),background .25s;
}
.switch.on{background:var(--gold-soft);border-color:var(--gold)}
.switch.on::after{transform:translateX(20px);background:var(--gold)}
.back-link{
  display:flex;align-items:center;gap:8px;padding:14px 16px;
  color:var(--gold);font-size:14px;font-weight:700;cursor:pointer;
}

/* ---------- CHAT SCREEN ---------- */
.chat-screen{
  transform:translateX(100%);
  transition:transform .32s cubic-bezier(.2,.8,.2,1);
  z-index:20;
}
.chat-screen.open{transform:translateX(0)}
.chat-head{
  height:60px;flex:none;display:flex;align-items:center;gap:10px;
  padding:0 8px 0 6px;border-bottom:1px solid var(--line);background:var(--bg);
}
.ch-meta{flex:1;min-width:0;cursor:pointer}
.ch-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-sub{font-size:11.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-sub.live{color:var(--gold)}
.chat-search{
  padding:9px 12px;border-bottom:1px solid var(--line);background:var(--card);
}
.chat-search input{width:100%;background:var(--card2);border-radius:10px;padding:10px 14px;font-size:14px}
.chat-body{
  flex:1;overflow-y:auto;padding:16px 12px 10px;
  display:flex;flex-direction:column;gap:3px;
  background-image:radial-gradient(rgba(212,175,55,.055) 1px,transparent 1px);
  background-size:22px 22px;
}
.day-sep{
  align-self:center;margin:12px 0 6px;font-size:10.5px;letter-spacing:1px;
  text-transform:uppercase;color:var(--muted);font-weight:700;
  background:var(--card);border:1px solid var(--line);
  padding:4px 12px;border-radius:20px;
}
.msg{max-width:80%;display:flex;flex-direction:column;position:relative;animation:pop .22s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.them{align-self:flex-start;align-items:flex-start}
.bubble{
  padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.48;
  word-break:break-word;position:relative;cursor:pointer;
  transition:transform .12s;
}
.bubble:active{transform:scale(.985)}
.msg.them .bubble{background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:5px;color:var(--text)}
.msg.me .bubble{background:var(--mine);color:var(--mine-text);border-bottom-right-radius:5px;font-weight:500}
.msg-sender{font-size:11px;color:var(--gold);font-weight:800;margin:0 0 3px 4px;letter-spacing:.3px}
.msg-foot{
  display:flex;align-items:center;gap:4px;justify-content:flex-end;
  font-size:10px;margin-top:4px;opacity:.75;
}
.msg.me .msg-foot{color:rgba(11,11,11,.65)}
.msg.them .msg-foot{color:var(--muted)}
.ticks{display:inline-flex}
.ticks svg{width:14px;height:14px}
.ticks.read{color:#0B0B0B}
.msg.them .ticks.read{color:var(--gold)}
.reactions{
  display:flex;gap:4px;margin-top:-8px;z-index:2;
  background:var(--card);border:1px solid var(--line);
  padding:3px 8px;border-radius:20px;font-size:12px;
  box-shadow:0 4px 14px rgba(0,0,0,.35);
}
.msg.me .reactions{align-self:flex-end}
.voice-msg{display:flex;align-items:center;gap:10px;min-width:170px}
.wave{display:flex;align-items:center;gap:2.5px;height:22px}
.wave i{width:3px;border-radius:3px;background:currentColor;opacity:.65;display:block}
.play-btn{
  width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:rgba(0,0,0,.18);
}
.msg.them .play-btn{background:rgba(212,175,55,.18);color:var(--gold)}
.attach-img{
  width:220px;height:150px;border-radius:12px;
  background:linear-gradient(135deg,#2a2a2a,#111);
  display:grid;place-items:center;color:var(--gold);font-size:11px;letter-spacing:1px;
  border:1px solid rgba(212,175,55,.25);
}
.file-msg{display:flex;align-items:center;gap:11px;min-width:190px}
.file-ic{
  width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:rgba(0,0,0,.18);
}
.msg.them .file-ic{background:var(--gold-soft);color:var(--gold)}
.file-name{font-size:13.5px;font-weight:650}
.file-size{font-size:11px;opacity:.7;margin-top:2px}

/* typing */
.typing{display:flex;gap:4px;padding:13px 16px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* composer */
.composer{
  flex:none;display:flex;align-items:flex-end;gap:6px;
  padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:var(--bg);
}
.msg-input{
  flex:1;background:var(--card2);border:1px solid var(--line);
  border-radius:22px;padding:12px 16px;font-size:14.5px;max-height:110px;resize:none;
  transition:border-color .2s;
}
.msg-input:focus{border-color:rgba(212,175,55,.5)}
.send-btn{
  width:44px;height:44px;border-radius:50%;flex:none;
  background:var(--gold);color:#0B0B0B;display:grid;place-items:center;
  transition:transform .12s,filter .2s;
}
.send-btn:active{transform:scale(.9)}
.mic-btn{color:var(--gold)}
.readonly-note{
  flex:none;text-align:center;padding:12px;font-size:11.5px;color:var(--muted);
  border-top:1px solid var(--line);letter-spacing:.5px;
}

/* ---------- CALL OVERLAY ---------- */
.call-overlay{
  position:absolute;inset:0;z-index:60;
  background:linear-gradient(180deg,#0B0B0B 0%,#141008 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;opacity:0;pointer-events:none;transition:opacity .3s;
}
.call-overlay.on{opacity:1;pointer-events:auto}
.call-av{margin-bottom:22px;animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,.25)}50%{box-shadow:0 0 0 22px rgba(212,175,55,0)}}
.call-name{font-size:25px;font-weight:800;letter-spacing:.4px}
.call-code{color:var(--gold);font-family:ui-monospace,Menlo,monospace;font-size:14px;margin-top:7px;letter-spacing:1px}
.call-status{color:var(--muted);font-size:13.5px;margin-top:16px;letter-spacing:.6px}
.call-controls{
  display:flex;gap:18px;margin-top:60px;
}
.call-btn{
  width:62px;height:62px;border-radius:50%;
  background:var(--card2);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--text);
  transition:transform .12s,background .2s;
}
.call-btn:active{transform:scale(.92)}
.call-btn.active{background:var(--gold);color:#0B0B0B;border-color:var(--gold)}
.call-btn.end{background:var(--red);color:#fff;border-color:var(--red)}
.call-video-preview{
  position:absolute;top:24px;right:20px;width:100px;height:150px;border-radius:16px;
  background:linear-gradient(135deg,#242424,#0d0d0d);
  border:1px solid rgba(212,175,55,.3);
  display:grid;place-items:center;color:var(--muted);font-size:11px;
}

/* ---------- SHEET / MODAL ---------- */
.backdrop{
  position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:70;
  opacity:0;pointer-events:none;transition:opacity .25s;
  backdrop-filter:blur(3px);
}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:71;
  background:var(--card);
  border-radius:22px 22px 0 0;
  border-top:1px solid var(--line);
  max-height:86%;overflow-y:auto;
  transform:translateY(102%);
  transition:transform .32s cubic-bezier(.2,.8,.2,1);
  padding-bottom:calc(18px + env(safe-area-inset-bottom));
}
.sheet.on{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;border-radius:4px;background:var(--line);margin:10px auto 4px}
.sheet-title{padding:14px 20px 6px;font-size:17px;font-weight:800;letter-spacing:.3px}
.sheet-body{padding:8px 16px 12px}
.sheet-item{
  display:flex;align-items:center;gap:14px;padding:14px 12px;border-radius:12px;
  cursor:pointer;font-size:14.5px;transition:background .15s;
}
.sheet-item:hover{background:var(--card2)}
.sheet-item .set-ic{color:var(--gold)}
.sheet-item.danger{color:var(--red)}
.sheet-item.danger .set-ic{color:var(--red)}
.emoji-row{display:flex;gap:8px;justify-content:space-around;padding:10px 4px}
.emoji-row button{
  font-size:26px;width:52px;height:52px;border-radius:50%;
  transition:transform .15s,background .2s;
}

function fmtDay(ts){
  const d = new Date(ts), n = new Date();
  const same = (a,b)=>a.toDateString()===b.toDateString();
  if(same(d,n)) return 'Today';
  const y = new Date(n.getTime()-864e5);

  const diff = Date.now()-ts;

    settings:{theme:'dark', lang:'English', notifications:true, readReceipts:true, onlineStatus:true},
    auth:{created:now}
  };
}

/* ---------- BOOT ---------- */
function boot(){
  const saved = loadState();
  if(saved && saved.me){
    S = saved;
    applyTheme();
    enterApp();
  } else {
    renderAuth('email');
  }
}

function applyTheme(){
  document.body.classList.toggle('light', S?.settings?.theme === 'light');
}

function enterApp(){
  $('#authScreen').classList.add('hidden');
  $('#mainScreen').classList.remove('hidden');
  renderTabbar();
  render();
}

/* ============================================================
   TAB BAR
   ============================================================ */
const TABS = [
  {id:'chats',     label:'Chats',      icon:'chat'},
  {id:'calls',     label:'Calls',      icon:'phone'},
  {id:'groups',    label:'Groups',     icon:'users'},
  {id:'challenges',label:'Challenges', icon:'target'},
  {id:'profile',   label:'Profile',    icon:'user'}
];
function renderTabbar(){
  $('#tabbar').innerHTML = TABS.map(t=>`
    <button data-tab="${t.id}" class="${t.id===tab?'active':''}">
      <span class="ic">${I[t.icon]}</span><span>${t.label}</span>
    </button>`).join('');
  $$('#topbar .icon-btn')[0].innerHTML = `<span class="ic">${I.search}</span>`;

/* ============================================================
   MAIN RENDER
   ============================================================ */
function render(){
  const v = $('#views');
  if(tab==='chats')       v.innerHTML = viewChats();
  else if(tab==='calls')  v.innerHTML = viewCalls();
  else if(tab==='groups') v.innerHTML = viewGroups();
  else if(tab==='challenges') v.innerHTML = viewChallenges();
  else if(tab==='profile')v.innerHTML = viewProfile();
  else if(tab==='settings')v.innerHTML = viewSettings();

  $$('#tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  $('#topbar').classList.toggle('hidden', tab==='settings');
  $('#tabbar').classList.toggle('hidden', tab==='settings');
  save();
}

/* ---------- CHATS ---------- */
function lastMsg(c){ return c.messages[c.messages.length-1]; }
function previewOf(m){
  if(!m) return 'No messages yet';
  const who = m.from==='me' ? 'You: ' : '';
  switch(m.type){
    case 'voice': return who+'🎤 Voice note';
    case 'image': return who+'📷 Photo';
    case 'file':  return who+'📄 '+m.text;
    case 'gif':   return who+'GIF';
    default: return who + (m.text||'');
  }
}
function chatLastTs(c){
  const m = lastMsg(c);
  return m ? m.time : 0;
}

function viewChats(){
  const dms = S.chats.map(c=>({kind:'dm', id:c.code, name:c.alias, online:c.online, unread:c.unread, muted:c.muted, ts:chatLastTs(c), prev:previewOf(lastMsg(c)), pinned:!!c.messages.length}));
  const grps = S.groups.map(g=>({kind:'group', id:g.id, name:g.name, online:false, unread:0, muted:false, ts:chatLastTs(g), prev:previewOf(lastMsg(g)), pinned:false}));
  const all = [...dms, ...grps].sort((a,b)=>b.ts-a.ts);

  if(!all.length) return `<div class="empty">No conversations yet.<br>Search a Code ID to start.</div>`;

  return all.map(r=>{
    const isGroup = r.kind==='group';
    return `
    <div class="row" data-act="openChat" data-kind="${r.kind}" data-id="${esc(r.id)}">
      ${avHTML(r.name, r.online, isGroup?'group':'')}
      <div class="row-main">
        <div class="row-top">
          <span class="row-name">${esc(r.name)}</span>
          <span class="row-time">${r.ts?relTime(r.ts):''}</span>
        </div>
        <div class="row-bot">
          <span class="row-prev">${isGroup?'<span class="pin-ic">'+I.users+'</span>':''}${esc(r.prev).slice(0,60)}</span>
          ${r.unread?`<span class="badge">${r.unread}</span>`:''}
          ${r.muted?`<span class="pin-ic">${I.mute}</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('') + `<button class="fab" data-act="openSearch"><span class="ic">${I.plus}</span></button>`;
}

/* ---------- CALLS ---------- */
function viewCalls(){
  const list = [...S.calls].sort((a,b)=>b.time-a.time);
  const head = `<div class="view-head">Calls</div>`;
  if(!list.length) return head+`<div class="empty">No calls yet.</div>`;
  return head + list.map(c=>{
    const dirIc = c.dir==='miss' ? I.missed : (c.dir==='in' ? I.inbox : I.outbox);
    const color = c.dir==='miss' ? 'var(--red)' : 'var(--gold)';
    return `
    <div class="row" data-act="startCall" data-code="${esc(c.code)}" data-type="${c.type}">
      ${avHTML(c.alias,false)}
      <div class="row-main">
        <div class="row-top">
          <span class="row-name">${esc(c.alias)} ${ctag(c.code)}</span>
          <span class="row-time">${relTime(c.time)}</span>
        </div>
        <div class="row-bot">
          <span class="row-prev" style="display:flex;align-items:center;gap:6px">
            <span class="ic" style="color:${color}"><span class="ic" style="display:none"></span>${dirIc}</span>
            ${c.type==='video'?'Video':'Voice'} · ${c.dir==='miss'?'Missed':(c.dir==='in'?'Incoming':'Outgoing')}
          </span>
          <span class="row-time">${c.dur||''}</span>
        </div>
      </div>
      <span class="ic" style="color:var(--gold)">${c.type==='video'?I.video:I.phone}</span>
    </div>`;
  }).join('');
}

/* ---------- GROUPS & CHANNELS ---------- */
function viewGroups(){
  let out = `<div class="view-head">Community</div>
    <div class="segment">
      <button class="${groupsSeg==='groups'?'active':''}" data-act="seg" data-seg="groups">Groups</button>
      <button class="${groupsSeg==='channels'?'active':''}" data-act="seg" data-seg="channels">Channels</button>
    </div>`;

  if(groupsSeg==='groups'){
    out += S.groups.map(g=>`
      <div class="row" data-act="openChat" data-kind="group" data-id="${esc(g.id)}">
        ${avHTML(g.name,false,'group')}
        <div class="row-main">
          <div class="row-top"><span class="row-name">${esc(g.name)}</span><span class="row-time">${relTime(chatLastTs(g)||Date.now())}</span></div>
          <div class="row-bot"><span class="row-prev">${g.members.length} members · ${esc(previewOf(lastMsg(g))).slice(0,40)}</span></div>
        </div>
      </div>`).join('');
    out += `<button class="fab" data-act="newGroup"><span class="ic">${I.plus}</span></button>`;
  } else {
    out += S.channels.map(c=>`
      <div class="row" data-act="openChat" data-kind="channel" data-id="${esc(c.id)}">
        ${avHTML(c.name,false,'group')}

          <div class="row-bot"><span class="row-prev">${esc(c.desc)}</span></div>
        </div>
      </div>`).join('');
  }
  return out;
}

/* ---------- CHALLENGES ---------- */
function statusTag(s){
  const map = {open:['open','Open'], locked:['locked','Locked'], completed:['done','Completed'], failed:['fail','Failed']};
  const [cls,label] = map[s]||['',''];
  return `<span class="tag ${cls}">${label}</span>`;
}
function viewChallenges(){
  let out = `<div class="view-head">Challenges <button class="icon-btn" data-act="newChallenge"><span class="ic">${I.plus}</span></button></div>`;
  out += S.challenges.map(c=>{
    const mine = c.assigned === S.me.code;
    let actions = '';
    if(c.status==='open'){
      actions = `<button class="btn small" data-act="claim" data-id="${c.id}">Claim Challenge</button>`;
    } else if(c.status==='locked' && mine){
      actions = `<button class="btn small" data-act="complete" data-id="${c.id}">Mark Complete</button>
                 <button class="btn small ghost" data-act="fail" data-id="${c.id}">Mark Failed</button>`;
    } else if(c.status==='locked'){
      actions = `<span class="muted">Assigned to ${ctag(c.assigned)}</span>`;
    } else if(c.status==='completed'){
      actions = `<span class="muted">Reward processing · ${ctag(c.assigned)}</span>`;
    } else if(c.status==='failed'){
      actions = `<span class="muted">Reopened for the network</span>`;
    }
    return `
    <div class="card-item">
      <div class="chal-head">
        <div class="chal-title">${esc(c.title)}</div>
        <div class="chal-reward">${esc(c.reward)}</div>
      </div>
      <div class="chal-desc">${esc(c.desc)}</div>
      <div class="chal-meta">
        ${statusTag(c.status)}
        <span class="tag">⏱ ${esc(c.deadline)}</span>
        <span class="tag">By ${ctag(c.by)}</span>
      </div>
      <div class="chal-actions">${actions}</div>
    </div>`;
  }).join('');
  return out;
}

/* ============================================================
   CHAT SCREEN
   ============================================================ */
function chatTarget(){
  if(!chatCtx) return null;
  if(chatCtx.kind==='dm')      return S.chats.find(c=>c.code===chatCtx.id);
  if(chatCtx.kind==='group')   return S.groups.find(g=>g.id===chatCtx.id);
  if(chatCtx.kind==='channel') return S.channels.find(c=>c.id===chatCtx.id);
  return null;
}
function targetName(t){ return chatCtx.kind==='dm' ? t.alias : t.name; }
function targetSub(t){
  if(chatCtx.kind==='dm') return t.typing ? 'typing…' : (t.online ? 'online' : 'offline');
  if(chatCtx.kind==='group') return `${t.members.length} members`;
  return `${t.subs} subscribers`;
}

function openChat(kind, id){
  chatCtx = {kind, id};
  if(kind==='dm'){
    let c = S.chats.find(x=>x.code===id);
    if(!c){
      const d = S.directory.find(x=>x.code===id) || {alias:'User', online:false};
      c = {code:id, alias:d.alias, online:d.online, unread:0, muted:false, archived:false, typing:false, pinned:[], messages:[]};
      S.chats.push(c);
    }
    c.unread = 0;
  }
  $('#chatScreen').classList.add('open');
  $('#chatSearchBar').classList.add('hidden');
  renderChat();
  save();
}

function closeChat(){
  $('#chatScreen').classList.remove('open');
  chatCtx = null;
  render();
}

function renderChat(){
  const t = chatTarget();
  if(!t) return;
  const isChannel = chatCtx.kind==='channel';
  const isDM = chatCtx.kind==='dm';

  /* header */
  $('#chatHead').innerHTML = `
    <button class="icon-btn" data-act="closeChat"><span class="ic">${I.back}</span></button>
    ${avHTML(targetName(t), isDM ? t.online : false, chatCtx.kind==='dm' ? 'sm' : 'sm group')}
    <div class="ch-meta" data-act="openPeerProfile">
      <div class="ch-name">${esc(targetName(t))}</div>
      <div class="ch-sub ${t.typing?'live':''}">${isDM ? '&lt;'+esc(t.code)+' · '+esc(targetSub(t)) : esc(targetSub(t))}</div>
    </div>
    ${isDM ? `
      <button class="icon-btn" data-act="voiceCall" data-code="${esc(t.code)}"><span class="ic">${I.phone}</span></button>
      <button class="icon-btn" data-act="videoCall" data-code="${esc(t.code)}"><span class="ic">${I.video}</span></button>` : ''}
    <button class="icon-btn" data-act="chatMenu"><span class="ic">${I.more}</span></button>`;

  renderMessages();

  /* composer */
  const wrap = $('#composerWrap');
  if(isChannel){
    wrap.innerHTML = `<div class="readonly-note">🔒 Only admins can post in this channel</div>`;
  } else {
    wrap.innerHTML = `
      <div class="composer">
        <button class="icon-btn" data-act="attach"><span class="ic">${I.clip}</span></button>
        <textarea class="msg-input" id="msgInput" rows="1" placeholder="Message"></textarea>
        <button class="icon-btn mic-btn" data-act="voiceNote"><span class="ic">${I.mic}</span></button>
        <button class="send-btn" data-act="send"><span class="ic">${I.send}</span></button>
      </div>`;
    const inp = $('#msgInput');
    inp.addEventListener('input', ()=>{
      inp.style.height='auto';
      inp.style.height = Math.min(inp.scrollHeight,110)+'px';
    });
    inp.addEventListener('keydown', e=>{
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
    });
  }
}

function renderMessages(){
  const t = chatTarget(); if(!t) return;
  const body = $('#chatBody');
  const q = ($('#chatSearchInput')?.value || '').toLowerCase().trim();
  let msgs = t.messages || [];
  if(q) msgs = msgs.filter(m=>(m.text||'').toLowerCase().includes(q));

  let html = '';
  let lastDay = '';
  msgs.forEach(m=>{
    const day = fmtDay(m.time);
    if(day !== lastDay){ html += `<div class="day-sep">${day}</div>`; lastDay = day; }
    html += msgHTML(m);
  });

  if(t.typing) html += `<div class="msg them"><div class="bubble typing"><i></i><i></i><i></i></div></div>`;
  if(!msgs.length && !t.typing) html += `<div class="empty">${q?'No messages found.':'No messages yet. Say hello 👋'}</div>`;

  body.innerHTML = html;
  body.scrollTop = body.scrollHeight;
}

function msgHTML(m){
  const mine = m.from === 'me';
  const isDM = chatCtx.kind === 'dm';
  const sender = (!mine && !isDM) ? (m.from==='001'?'LEO':m.from==='108'?'SKILL':m.from) : null;

  let inner = '';
  if(m.type==='voice'){
    const bars = Array.from({length:22},()=>`<i style="height:${5+rand(14)}px"></i>`).join('');
    inner = `<div class="voice-msg">
        <div class="play-btn"><span class="ic" style="width:14px">${I.play}</span></div>
        <div class="wave">${bars}</div>
        <span style="font-size:11px;opacity:.75">${m.dur||8}s</span>
      </div>`;
  } else if(m.type==='image'){
    inner = `<div class="attach-img">📷 PHOTO</div>`;
  } else if(m.type==='file'){
    inner = `<div class="file-msg">
        <div class="file-ic"><span class="ic">${I.file}</span></div>
        <div><div class="file-name">${esc(m.text)}</div><div class="file-size">${esc(m.size||'248 KB')}</div></div>
      </div>`;
  } else if(m.type==='gif'){
    inner = `<div class="attach-img" style="background:linear-gradient(135deg,#3a2f10,#151515)">GIF</div>`;
  } else {
    inner = esc(m.text).replace(/\n/g,'<br>');
  }

  const rEntries = Object.entries(m.reactions||{}).filter(([,v])=>v>0);
  const rHtml = rEntries.length
    ? `<div class="reactions">${rEntries.map(([e,v])=>`<span>${e}${v>1?' '+v:''}</span>`).join('')}</div>`
    : '';

  const ticks = mine ? `<span class="ticks ${m.status==='read'?'read':''}">${m.status==='sent'?I.check:I.checks}</span>` : '';

  return `
  <div class="msg ${mine?'me':'them'}" data-msg="${m.id}">
    ${sender?`<div class="msg-sender">${esc(sender)}</div>`:''}
    <div class="bubble" data-act="msgMenu" data-id="${m.id}">${inner}
      <div class="msg-foot"><span>${fmtTime(m.time)}</span>${ticks}</div>
    </div>
    ${rHtml}
  </div>`;
}

/* ---------- SENDING ---------- */
function pushMessage(obj){
  const t = chatTarget(); if(!t) return;
  t.messages.push(obj);
  save();
  renderMessages();
}

function sendMessage(){
  const inp = $('#msgInput');
  if(!inp) return;
  const text = inp.value.trim();
  if(!text) return;
  inp.value = '';
  inp.style.height = 'auto';
  pushMessage({id:uid(), from:'me', type:'text', text, time:Date.now(), status:'sent', reactions:{}});
  simulateDelivery();
  if(chatCtx.kind==='dm') simulateReply();
  if(chatCtx.kind==='group') simulateGroupReply();
}

function simulateDelivery(){
  const t = chatTarget(); if(!t) return;
  const last = t.messages[t.messages.length-1];
  if(!last || last.from!=='me') return;
  setTimeout(()=>{ last.status='delivered'; renderMessages(); save(); }, 600);
  setTimeout(()=>{ last.status='read'; renderMessages(); save(); }, 1600);
}

function simulateReply(){
  const t = chatTarget(); if(!t || chatCtx.kind!=='dm') return;
  const id = chatCtx.id;
  setTimeout(()=>{
    const cur = S.chats.find(c=>c.code===id);
    if(!cur) return;
    cur.typing = true;
    if(chatCtx && chatCtx.id===id) renderChat();
  }, 1100);
  setTimeout(()=>{
    const cur = S.chats.find(c=>c.code===id);
    if(!cur) return;
    cur.typing = false;
    cur.messages.push({
      id:uid(), from:id, type:'text',
      text: REPLIES[rand(REPLIES.length)],
      time: Date.now(), reactions:{}
    });
    if(chatCtx && chatCtx.id===id) renderChat();
    else { render(); }
    save();
  }, 2600);
}

function simulateGroupReply(){
  const g = chatTarget(); if(!g || chatCtx.kind!=='group') return;
  const gid = g.id;
  const others = g.members.filter(m=>m!==S.me.code);
  const who = others[rand(others.length)] || '001';
  setTimeout(()=>{
    const cur = S.groups.find(x=>x.id===gid);
    if(!cur) return;
    cur.typing = true;
    if(chatCtx && chatCtx.id===gid) renderChat();
  }, 1200);
  setTimeout(()=>{
    const cur = S.groups.find(x=>x.id===gid);
    if(!cur) return;
    cur.typing = false;
    cur.messages.push({id:uid(), from:who, type:'text', text:REPLIES[rand(REPLIES.length)], time:Date.now(), reactions:{}});
    if(chatCtx && chatCtx.id===gid) renderChat();
    save();
  }, 2800);
}

/* ============================================================
   CALLS
   ============================================================ */
let callState = null;
function startCall(code, type){
  const d = S.directory.find(x=>x.code===code) || {alias:'User'};
  callState = {code, alias:d.alias, type, muted:false, speaker:false, video:type==='video', t0:null, timer:null, secs:0};
  const ov = $('#callOverlay');
  $('#callAv').outerHTML = `<div class="av lg call-av" id="callAv">${esc(d.alias.slice(0,2).toUpperCase())}</div>`;
  $('#callName').textContent = d.alias;
  $('#callCode').innerHTML = '&lt;'+esc(code);
  $('#callStatus').textContent = 'Calling…';
  $('#callPreview').classList.toggle('hidden', type!=='video');
  updateCallButtons();
  ov.classList.add('on');

  setTimeout(()=>{
    if(!callState) return;
    $('#callStatus').textContent = 'Connected';
    callState.t0 = Date.now();
    callState.timer = setInterval(()=>{
      callState.secs++;
      const m = String(Math.floor(callState.secs/60)).padStart(2,'0');
      const s = String(callState.secs%60).padStart(2,'0');
      $('#callStatus').textContent = `${m}:${s}`;
    },1000);
  }, 2200);
}

function updateCallButtons(){
  if(!callState) return;
  $('#btnMute').innerHTML = `<span class="ic">${callState.muted?I.voloff:I.mic}</span>`;
  $('#btnMute').classList.toggle('active', callState.muted);
  $('#btnSpeaker').innerHTML = `<span class="ic">${callState.speaker?I.vol:I.voloff}</span>`;
  $('#btnSpeaker').classList.toggle('active', callState.speaker);
  $('#btnVideo').innerHTML = `<span class="ic">${callState.video?I.cam:I.camoff}</span>`;
  $('#btnVideo').classList.toggle('active', callState.video);
  $('#btnEnd').innerHTML = `<span class="ic">${I.phoneoff}</span>`;
}

function endCall(){
  if(!callState) return;
  clearInterval(callState.timer);
  const dur = callState.secs
    ? `${Math.floor(callState.secs/60)}:${String(callState.secs%60).padStart(2,'0')}`
    : '';
  S.calls.unshift({
    id:uid(), code:callState.code, alias:callState.alias,
    type:callState.type, dir:'out', time:Date.now(), dur
  });
  callState = null;
  $('#callOverlay').classList.remove('on');
  save();
  if(tab==='calls') render();
  toast('Call ended' + (dur?` · ${dur}`:''));
}

function openSheet(html){
  $('#sheetBody').innerHTML = html;
  $('#sheet').classList.add('on');
  $('#backdrop').classList.add('on');
}
function closeSheet(){
  $('#sheet').classList.remove('on');
  $('#backdrop').classList.remove('on');
}

/* ---------- SEARCH ---------- */
function openSearch(){
  openSheet(`
    <div class="sheet-title">Find by Code ID</div>
    <div class="sheet-body">
      <input class="input" id="searchInput" placeholder="Enter Code ID e.g. 001 or alias" autocomplete="off">
      <div id="searchResults"><p class="muted" style="margin-top:14px">Search anyone using their permanent Code ID.</p></div>
    </div>`);
  setTimeout(()=>$('#searchInput')?.focus(), 250);
  $('#searchInput').addEventListener('input', runSearch);
}

function runSearch(){
  const q = ($('#searchInput').value||'').trim().toLowerCase().replace(/^</,'');
  const box = $('#searchResults');
  if(!q){ box.innerHTML = `<p class="muted" style="margin-top:14px">Search anyone using their permanent Code ID.</p>`; return; }

  const results = S.directory.filter(d =>
    d.code.toLowerCase().includes(q) || d.alias.toLowerCase().includes(q)
  ).slice(0,6);

  if(!results.length){
    box.innerHTML = `<p class="muted" style="margin-top:14px">No member found for "${esc(q)}".</p>`;
    return;
  }

  box.innerHTML = results.map(d=>`
    <div class="result">
      <div class="result-top">
        ${avHTML(d.alias, d.online)}
        <div>
          <div class="result-name">${esc(d.alias)}</div>
          <div class="result-code">&lt;${esc(d.code)} · ${d.online?'online':'offline'}</div>
          <div class="result-bio">${esc(d.bio||'')}</div>
        </div>
      </div>
      <div class="result-actions">
        <button class="mini-btn" data-act="dm" data-code="${esc(d.code)}"><span class="ic" style="color:var(--gold)">${I.chat}</span>Message</button>
        <button class="mini-btn" data-act="call" data-code="${esc(d.code)}" data-type="voice"><span class="ic" style="color:var(--gold)">${I.phone}</span>Voice</button>
        <button class="mini-btn" data-act="call" data-code="${esc(d.code)}" data-type="video"><span class="ic" style="color:var(--gold)">${I.video}</span>Video</button>
        <button class="mini-btn" data-act="addContact" data-code="${esc(d.code)}"><span class="ic" style="color:var(--gold)">${I.plus}</span>Add</button>
      </div>
    </div>`).join('');
}

/* ============================================================
   EVENT HANDLING
   ============================================================ */
document.addEventListener('click', e=>{
  /* tab bar */
  const tb = e.target.closest('[data-tab]');
  if(tb){ tab = tb.dataset.tab; renderTabbar(); render(); $('#views').scrollTop = 0; return; }

  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;

  switch(act){

    /* ---- AUTH ---- */
    case 'sendOtp': {
      const email = $('#authEmail').value.trim();
      if(!email || !email.includes('@')) return toast('Enter a valid email');
      pendingAuth.email = email;
      renderAuth('otp');
      toast('Code sent to ' + email);
      break;
    }
    case 'verifyOtp': {
      const v = $('#authOtp').value.trim();
      if(v !== '1008') return toast('Invalid code — use 1008');
      pendingAuth.code = pickCode();
      renderAuth('alias');
      break;
    }
    case 'authBack': renderAuth('email'); break;
    case 'createIdentity': {
      const alias = ($('#authAlias').value.trim() || 'MEMBER').toUpperCase();
      S = seedState(pendingAuth.email, alias, pendingAuth.code);
      S.me.joined = new Date().toISOString();
      applyTheme(); save(); enterApp();
      toast('Welcome, ' + alias + ' — your Code is <' + S.me.code);
      break;
    }

    /* ---- NAV ---- */
    case 'openSearch': openSearch(); break;
    case 'openSettings': tab='settings'; render(); $('#views').scrollTop=0; break;
    case 'backToProfile': tab='profile'; render(); break;

    /* ---- SEARCH ACTIONS ---- */
    case 'dm': {
      closeSheet();
      setTimeout(()=>openChat('dm', el.dataset.code), 260);
      break;
    }
    case 'call': {
      closeSheet();
      const c = el.dataset.code, t = el.dataset.type;
      setTimeout(()=>startCall(c,t), 260);
      break;
    }
    case 'addContact': {
      const c = el.dataset.code;
      if(!S.contacts.includes(c)){ S.contacts.push(c); toast('Added <'+c+' to contacts'); }
      else toast('Already in contacts');
      save();
      break;
    }

    /* ---- CHAT LIST ---- */
    case 'openChat': openChat(el.dataset.kind, el.dataset.id); break;

    /* ---- CHAT SCREEN ---- */
    case 'closeChat': closeChat(); break;
    case 'send': sendMessage(); break;
    case 'voiceNote': {
      pushMessage({id:uid(), from:'me', type:'voice', text:'', dur: 3+rand(20), time:Date.now(), status:'sent', reactions:{}});
      simulateDelivery(); if(chatCtx.kind==='dm') simulateReply();
      toast('Voice note sent');
      break;
    }
    case 'attach': {
      openSheet(`
        <div class="sheet-title">Attach</div>
        <div class="sheet-body">
          <div class="sheet-item" data-act="attachType" data-t="image"><span class="set-ic">${I.image}</span> Photo</div>
          <div class="sheet-item" data-act="attachType" data-t="file"><span class="set-ic">${I.file}</span> Document</div>
          <div class="sheet-item" data-act="attachType" data-t="gif"><span class="set-ic">${I.gif}</span> GIF</div>
        </div>`);
      break;
    }
    case 'attachType': {
      const t = el.dataset.t;
      closeSheet();
      const map = {
        image:{type:'image', text:''},
        file:{type:'file', text:'Code1008-spec.pdf', size:'248 KB'},
        gif:{type:'gif', text:''}
      };
      setTimeout(()=>{
        pushMessage({id:uid(), from:'me', ...map[t], time:Date.now(), status:'sent', reactions:{}});
        simulateDelivery(); if(chatCtx.kind==='dm') simulateReply();
      }, 260);
      break;
    }
    case 'msgMenu': openMsgMenu(el.dataset.id); break;
    case 'react': {
      const t = chatTarget();
      const m = t.messages.find(x=>x.id===el.dataset.id);
      const emo = el.dataset.emoji;
      if(m){
        m.reactions = m.reactions || {};
        if(m._mine === emo){ m.reactions[emo] = Math.max(0,(m.reactions[emo]||1)-1); m._mine = null; }
        else { m.reactions[emo] = (m.reactions[emo]||0)+1; m._mine = emo; }
        save(); renderMessages();
      }
      closeSheet();
      break;
    }
    case 'copyMsg': {
      const t = chatTarget();
      const m = t.messages.find(x=>x.id===el.dataset.id);
      if(m?.text) navigator.clipboard?.writeText(m.text);
      closeSheet(); toast('Copied');
      break;
    }
    case 'deleteMsg': {
      const t = chatTarget();
      t.messages = t.messages.filter(x=>x.id!==el.dataset.id);
      closeSheet(); save(); renderMessages();
      break;
    }
    case 'chatMenu': openChatMenu(); break;
    case 'searchChat': {
      closeSheet();
      setTimeout(()=>{
        $('#chatSearchBar').classList.remove('hidden');
        $('#chatSearchInput').value='';
        $('#chatSearchInput').focus();
        renderMessages();
      },260);
      break;
    }
    case 'pinChat': {
      const t = chatTarget();
      closeSheet();
      if(t.pinned?.length) toast('📌 ' + t.pinned.join(' · ').slice(0,60));
      else toast('No pinned messages');
      break;
    }
    case 'muteChat': {
      const t = chatTarget();
      t.muted = !t.muted;
      closeSheet(); save(); toast(t.muted?'Chat muted':'Chat unmuted');
      break;
    }
    case 'archiveChat': {
      const t = chatTarget();
      t.archived = true;
      closeSheet(); closeChat(); toast('Chat archived');
      break;
    }
    case 'clearChat': {
      const t = chatTarget();
      t.messages = [];
      closeSheet(); save(); renderMessages(); toast('Chat cleared');
      break;
    }
    case 'openPeerProfile': {
      if(chatCtx.kind!=='dm') return;
      const d = S.directory.find(x=>x.code===chatCtx.id);
      if(!d) return;
      openSheet(`
        <div class="sheet-title">${esc(d.alias)}</div>
        <div class="sheet-body">
          <div class="result-top" style="margin-bottom:6px">
            ${avHTML(d.alias,d.online,'lg')}
          </div>
          <div class="center" style="margin:10px 0 4px">
            <div class="result-code" style="font-size:16px">&lt;${esc(d.code)}</div>
            <div class="muted" style="margin-top:8px">${esc(d.bio||'')}</div>
          </div>
          <div class="info-grid" style="padding:12px 0">
            <div class="info-cell"><div class="k">Skills</div><div class="v">${esc(d.skills||'—')}</div></div>
            <div class="info-cell"><div class="k">Location</div><div class="v">${esc(d.location||'—')}</div></div>
            <div class="info-cell"><div class="k">Joined</div><div class="v">${esc(d.joined||'—')}</div></div>
            <div class="info-cell"><div class="k">Status</div><div class="v" style="color:var(--green)">${d.online?'Online':'Offline'}</div></div>
          </div>
          <div class="result-actions">
            <button class="mini-btn" data-act="call" data-code="${esc(d.code)}" data-type="voice"><span class="ic" style="color:var(--gold)">${I.phone}</span>Voice</button>
            <button class="mini-btn" data-act="call" data-code="${esc(d.code)}" data-type="video"><span class="ic" style="color:var(--gold)">${I.video}</span>Video</button>
            <button class="mini-btn" data-act="addContact" data-code="${esc(d.code)}"><span class="ic" style="color:var(--gold)">${I.plus}</span>Add</button>
          </div>
        </div>`);
      break;
    }
    case 'voiceCall': startCall(el.dataset.code,'voice'); break;
    case 'videoCall': startCall(el.dataset.code,'video'); break;

    /* ---- CALLS ---- */
    case 'callMute': callState.muted = !callState.muted; updateCallButtons(); break;
    case 'callSpeaker': callState.speaker = !callState.speaker; updateCallButtons(); break;
    case 'callVideo': callState.video = !callState.video; updateCallButtons(); break;
    case 'callEnd': endCall(); break;
    case 'startCall': startCall(el.dataset.code, el.dataset.type); break;

    /* ---- GROUPS ---- */
    case 'seg': groupsSeg = el.dataset.seg; render(); break;
    case 'newGroup': openNewGroup(); break;
    case 'addMember': {
      const inp = $('#gCode');
      const c = inp.value.trim().replace(/^</,'');
      if(!c) return;
      const exists = S.directory.find(d=>d.code===c);
      if(!exists) return toast('No member with Code <'+c);
      if(!groupDraft.members.includes(c)) groupDraft.members.push(c);
      inp.value='';
      $('#gChips').innerHTML = groupDraft.members.map(mc=>{
        const d = S.directory.find(x=>x.code===mc);
        return `<span class="chip">${esc(d.alias)} &lt;${esc(mc)}<span class="x" data-act="rmMember" data-code="${esc(mc)}">×</span></span>`;
      }).join('');
      break;
    }
    case 'rmMember': {
      groupDraft.members = groupDraft.members.filter(x=>x!==el.dataset.code);
      $('#gChips').innerHTML = groupDraft.members.map(mc=>{
        const d = S.directory.find(x=>x.code===mc);
        return `<span class="chip">${esc(d.alias)} &lt;${esc(mc)}<span class="x" data-act="rmMember" data-code="${esc(mc)}">×</span></span>`;
      }).join('');
      break;
    }
    case 'createGroup': {
      const name = $('#gName').value.trim();
      if(!name) return toast('Group name required');
      const g = {
        id: 'g'+uid(),
        name,
        desc: $('#gDesc').value.trim() || 'No description',
        members: [...new Set([...groupDraft.members, S.me.code])],
        messages: [{id:uid(), from:'me', type:'text', text:'Group created. Code IDs only. 👑', time:Date.now(), status:'read', reactions:{}}]
      };
      S.groups.push(g);
      closeSheet(); save();
      groupsSeg='groups'; tab='groups'; render();
      toast('Group "'+name+'" created');
      break;
    }

    /* ---- CHALLENGES ---- */
    case 'newChallenge': openNewChallenge(); break;
    case 'createChallenge': {
      const title = $('#cTitle').value.trim();
      if(!title) return toast('Title required');
      S.challenges.unshift({
        id:'c'+uid(), title,
        desc: $('#cDesc').value.trim() || 'No description',
        reward: $('#cReward').value.trim() || '$1008',
        deadline: $('#cDeadline').value.trim() || '7 days',
        by: S.me.code, status:'open', assigned:null
      });
      closeSheet(); save(); render();
      toast('Challenge posted');
      break;
    }
    case 'claim': {
      const c = S.challenges.find(x=>x.id===el.dataset.id);
      if(!c || c.status!=='open') return;
      c.status='locked'; c.assigned = S.me.code;
      save(); render();
      toast('Locked to <'+S.me.code+' 🔒');
      break;
    }
    case 'complete': {
      const c = S.challenges.find(x=>x.id===el.dataset.id);
      if(!c) return;
      c.status='completed';
      save(); render();
      toast('Completed — reward processing 💰');
      break;
    }
    case 'fail': {
      const c = S.challenges.find(x=>x.id===el.dataset.id);
      if(!c) return;
      c.status='open'; c.assigned=null;
      save(); render();
      toast('Challenge reopened for the network');
      break;
    }

    /* ---- PROFILE / SETTINGS ---- */
    case 'editProfile': openEditProfile(); break;
    case 'saveProfile': {
      S.me.alias = ($('#pAlias').value.trim()||'MEMBER').toUpperCase();
      S.me.bio = $('#pBio').value.trim();
      S.me.skills = $('#pSkills').value.trim();
      S.me.location = $('#pLoc').value.trim();
      S.me.status = $('#pStatus').value.trim() || 'Available';
      closeSheet(); save(); render();
      toast('Profile updated');
      break;
    }
    case 'shareCode': {
      const text = `${S.me.alias}<>${S.me.code}`;
      navigator.clipboard?.writeText(text);
      toast('Copied: ' + text);
      break;
    }
    case 'toggleTheme': {
      S.settings.theme = S.settings.theme==='dark' ? 'light' : 'dark';
      applyTheme(); save(); render();
      break;
    }
    case 'toggle': {
      const k = el.dataset.key;
      S.settings[k] = !S.settings[k];
      save(); render();
      break;
    }
    case 'blockedList': {
      openSheet(`
        <div class="sheet-title">Blocked Users</div>
        <div class="sheet-body">
          ${S.blocked.length ? S.blocked.map(c=>`<div class="sheet-item">${ctag(c)}</div>`).join('')
            : '<p class="muted">No blocked users. Your Code stays private.</p>'}
        </div>`);
      break;
    }
    case 'language': {
      const langs = ['English','Arabic','Hindi','Spanish','French','German'];
      openSheet(`
        <div class="sheet-title">Language</div>
        <div class="sheet-body">
          ${langs.map(l=>`<div class="sheet-item" data-act="setLang" data-lang="${l}">
            <span class="set-ic">${l===S.settings.lang?I.check:I.globe}</span> ${l}</div>`).join('')}
        </div>`);
      break;
    }
    case 'setLang': {
      S.settings.lang = el.dataset.lang;
      closeSheet(); save(); render();
      toast('Language: ' + S.settings.lang);
      break;
    }
    case 'logout': {
      if(confirm('Sign out of Code1008? Your Code ID stays yours.')){
        localStorage.removeItem(KEY);
        S = null; chatCtx = null;
        $('#mainScreen').classList.add('hidden');
        $('#authScreen').classList.remove('hidden');
        $('#chatScreen').classList.remove('open');
        document.body.classList.remove('light');
        renderAuth('email');
      }
      break;
    }
  }
});

/* backdrop / sheet close */
$('#backdrop').addEventListener('click', closeSheet);

/* chat search input */
document.addEventListener('input', e=>{
  if(e.target.id === 'chatSearchInput') renderMessages();
});

/* long-press on message → reaction menu */
let pressTimer = null;
$('#chatBody').addEventListener('pointerdown', e=>{
  const b = e.target.closest('.bubble');
  if(!b || b.classList.contains('typing')) return;
  pressTimer = setTimeout(()=>{
    const msgEl = b.closest('.msg');
    if(msgEl) openMsgMenu(msgEl.dataset.msg);
  }, 550);
});
['pointerup','pointerleave','pointercancel','scroll'].forEach(ev=>{
  $('#chatBody').addEventListener(ev, ()=>clearTimeout(pressTimer));
});
$('#chatBody').addEventListener('dblclick', e=>{
  const b = e.target.closest('.bubble');
  if(!b) return;
  const msgEl = b.closest('.msg');
  if(msgEl) openMsgMenu(msgEl.dataset.msg);
});

/* keyboard: escape closes overlays */
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){
    if($('#sheet').classList.contains('on')) closeSheet();
    else if($('#chatScreen').classList.contains('open')) closeChat();
  }
});

/* ---------- GO ---------- */
boot();
</script>
</body>
</html>
