
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>CODE1008 — Private Network</title>
<style>
/* ============================================================
   BASE
============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
:root{
  --bg:#000000;
  --surface:#0b0b0d;
  --surface-2:#131316;
  --elevated:#1c1c20;
  --elevated-2:#26262b;
  --line:rgba(255,255,255,.075);
  --line-strong:rgba(255,255,255,.13);
  --text:#f4f4f6;
  --muted:#8a8a93;
  --muted-2:#5d5d66;
  --gold:#d9b36c;
  --gold-2:#b98f45;
  --gold-soft:rgba(217,179,108,.14);
  --green:#30d158;
  --red:#ff453a;
  --blue:#0a84ff;
  --radius:18px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
[hidden]{display:none !important;}
html,body{margin:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  background:#050506;
  color:var(--text);
  display:grid;
  place-items:center;
  min-height:100dvh;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-0.01em;
}
button{font-family:inherit;}
input,textarea{font-family:inherit;}
::-webkit-scrollbar{width:0;height:0;display:none;}
.scroll{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}

/* ============================================================
   PHONE FRAME
============================================================ */
.phone{
  position:relative;
  width:100%;
  max-width:440px;
  height:100dvh;
  background:var(--bg);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  isolation:isolate;
}
@media (min-width:560px){
  body{padding:28px 0;}
  .phone{
    height:min(890px,calc(100dvh - 56px));
    border-radius:34px;
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 50px 140px -30px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.02) inset;
  }
}
.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  background:var(--bg);
}

/* ============================================================
   AVATARS
============================================================ */
.avatar{
  border-radius:50%;
  display:grid;place-items:center;
  flex:none;
  background:
    radial-gradient(circle at 30% 25%, hsl(var(--h) 55% 42%), transparent 70%),
    linear-gradient(150deg, hsl(var(--h) 50% 26%), hsl(calc(var(--h) + 45) 45% 12%));
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 2px 10px rgba(0,0,0,.4);
  user-select:none;
  line-height:1;
}
.avatar.sm{width:38px;height:38px;font-size:16px;}
.avatar.md{width:48px;height:48px;font-size:20px;}
.avatar.lg{width:74px;height:74px;font-size:32px;}
.avatar.xl{width:104px;height:104px;font-size:46px;}

/* ============================================================
   TYPOGRAPHY HELPERS
============================================================ */
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;letter-spacing:0;}
.sep{color:var(--muted-2);margin:0 1px;font-weight:400;}
.code-txt{color:var(--gold);font-weight:600;}

/* ============================================================
   ONBOARDING
============================================================ */
#onboard{
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(217,179,108,.16), transparent 60%),
    radial-gradient(90% 50% at 50% 110%, rgba(120,90,255,.10), transparent 60%),
    #000;
}
.ob{flex:1;display:flex;flex-direction:column;padding:calc(var(--sat) + 26px) 22px calc(var(--sab) + 22px);overflow-y:auto;}
.ob-hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;min-height:0;}
.mark{
  width:88px;height:88px;border-radius:26px;
  display:grid;place-items:center;
  font-size:26px;font-weight:800;letter-spacing:-0.04em;
  color:#1a1408;
  background:linear-gradient(140deg,#f0d79b,#c39a4e 55%,#8f6a2a);
  box-shadow:0 20px 50px -12px rgba(217,179,108,.5), inset 0 1px 0 rgba(255,255,255,.5);
}
.ob-title{font-size:34px;font-weight:800;letter-spacing:-0.035em;margin:0;}
.ob-title span{background:linear-gradient(120deg,#f2dda9,#c39a4e);-webkit-background-clip:text;background-clip:text;color:transparent;}
.ob-sub{color:var(--muted);font-size:14.5px;line-height:1.55;max-width:290px;margin:0;}
.ob-feats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
.pill{
  font-size:11.5px;padding:6px 11px;border-radius:999px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  color:var(--muted);
}
.ob-step{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);font-weight:700;margin-bottom:12px;}
.ob-h{font-size:24px;font-weight:750;letter-spacing:-0.03em;margin:0 0 6px;}
.ob-p{color:var(--muted);font-size:13.5px;line-height:1.5;margin:0 0 20px;}

.tier-card{
  display:flex;align-items:center;gap:13px;
  padding:14px;border-radius:16px;
  background:var(--surface-2);
  border:1px solid var(--line);
  margin-bottom:10px;cursor:pointer;
  transition:transform .15s ease, border-color .2s, background .2s;
}
.tier-card:active{transform:scale(.985);}
.tier-card.sel{border-color:rgba(217,179,108,.55);background:linear-gradient(180deg,rgba(217,179,108,.10),rgba(217,179,108,.03));}
.tier-dot{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:18px;flex:none;border:1px solid rgba(255,255,255,.08);}
.tier-meta{flex:1;min-width:0;}
.tier-name{font-size:14.5px;font-weight:650;display:flex;align-items:center;gap:7px;}
.tier-desc{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35;}
.tier-price{font-size:11.5px;font-weight:700;color:var(--gold);white-space:nowrap;}

.field{
  width:100%;padding:14px 15px;border-radius:14px;
  background:var(--surface-2);border:1px solid var(--line);
  color:var(--text);font-size:15px;outline:none;
  transition:border-color .2s;
}
.field:focus{border-color:rgba(217,179,108,.5);}
.field::placeholder{color:var(--muted-2);}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);font-weight:700;margin:0 0 7px 2px;}

.gen-code{
  margin-top:12px;padding:14px 15px;border-radius:14px;
  background:linear-gradient(135deg,rgba(217,179,108,.13),rgba(217,179,108,.04));
  border:1px dashed rgba(217,179,108,.4);
  display:flex;align-items:center;justify-content:space-between;
}
.gen-code .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;}
.gen-code .v{font-size:19px;font-weight:700;color:var(--gold);letter-spacing:.02em;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:none;border-radius:14px;padding:13px 18px;
  font-size:14px;font-weight:650;cursor:pointer;
  background:var(--elevated);color:var(--text);
  transition:transform .12s ease,opacity .2s,background .2s;
}
.btn:active{transform:scale(.965);}
.btn.gold{background:linear-gradient(135deg,#efd8a4,#c39a4e 60%,#a97f37);color:#1a1408;box-shadow:0 12px 30px -12px rgba(217,179,108,.6);}
.btn.block{width:100%;}
.btn.ghost{background:transparent;border:1px solid var(--line-strong);color:var(--muted);}
.btn.sm{padding:9px 13px;font-size:12.5px;border-radius:11px;}

/* ============================================================
   APP SHELL
============================================================ */
.topbar{
  flex:none;
  padding:calc(var(--sat) + 10px) 16px 10px;
  display:flex;align-items:center;gap:12px;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border-bottom:1px solid var(--line);
  z-index:10;
}
.topbar h1{font-size:19px;font-weight:750;letter-spacing:-0.03em;margin:0;flex:1;min-width:0;}
.topbar .sub{font-size:11px;color:var(--muted);font-weight:500;margin-top:1px;letter-spacing:0;}
.tb-brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.tb-mark{
  width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  font-size:11px;font-weight:800;color:#1a1408;
  background:linear-gradient(140deg,#f0d79b,#c39a4e);
  flex:none;
}
.icon-btn{
  width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;flex:none;
  background:transparent;border:none;color:var(--text);
  cursor:pointer;transition:background .18s,transform .12s;
  position:relative;
}
.icon-btn:active{transform:scale(.9);background:rgba(255,255,255,.06);}
.icon-btn svg{width:21px;height:21px;}
.badge-dot{
  position:absolute;top:6px;right:6px;
  min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:var(--red);color:#fff;font-size:10px;font-weight:700;
  display:grid;place-items:center;border:2px solid #000;
}

.views{flex:1;position:relative;overflow:hidden;}
.view{
  position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;
  padding-bottom:24px;display:none;
  -webkit-overflow-scrolling:touch;
}
.view.active{display:block;animation:vfade .22s ease;}
@keyframes vfade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ============================================================
   TABBAR
============================================================ */
.tabbar{
  flex:none;display:flex;
  padding:8px 6px calc(var(--sab) + 8px);
  background:rgba(8,8,10,.86);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-top:1px solid var(--line);
  z-index:10;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--muted-2);
  font-size:9.5px;font-weight:600;letter-spacing:.01em;
  padding:5px 2px;cursor:pointer;border-radius:12px;
  transition:color .18s,transform .12s;position:relative;
}
.tab:active{transform:scale(.93);}
.tab svg{width:22px;height:22px;}
.tab.on{color:var(--gold);}
.tab .tbadge{
  position:absolute;top:0;right:calc(50% - 20px);
  min-width:15px;height:15px;padding:0 4px;border-radius:8px;
  background:var(--red);color:#fff;font-size:9.5px;font-weight:700;
  display:grid;place-items:center;
}

/* ============================================================
   LISTS
============================================================ */
.section-head{
  padding:18px 16px 8px;
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted-2);font-weight:700;
  display:flex;align-items:center;justify-content:space-between;
}
.section-head button{
  background:none;border:none;color:var(--gold);font-size:11px;
  font-weight:700;letter-spacing:.06em;cursor:pointer;text-transform:uppercase;
}

.row{
  display:flex;align-items:center;gap:13px;
  padding:11px 16px;cursor:pointer;
  transition:background .15s;position:relative;
}
.row:active{background:rgba(255,255,255,.045);}
.row-body{flex:1;min-width:0;}
.row-top{display:flex;align-items:baseline;gap:8px;}
.row-name{
  font-size:14.5px;font-weight:640;letter-spacing:-0.015em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.row-code{font-size:11px;color:var(--gold);font-weight:600;opacity:.85;}
.row-time{font-size:11px;color:var(--muted-2);margin-left:auto;flex:none;padding-left:8px;}
.row-prev{
  font-size:12.5px;color:var(--muted);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.row-prev .who{color:var(--muted-2);}
.unread{
  min-width:19px;height:19px;padding:0 5px;border-radius:10px;
  background:linear-gradient(135deg,#efd8a4,#c39a4e);color:#1a1408;
  font-size:10.5px;font-weight:800;display:grid;place-items:center;
  flex:none;margin-left:8px;
}
.verified{
  display:inline-grid;place-items:center;
  width:13px;height:13px;border-radius:50%;
  background:var(--gold);color:#1a1408;font-size:8px;font-weight:900;
  margin-left:5px;flex:none;
}

/* ============================================================
   DISCOVER
============================================================ */
.disc-search{
  padding:12px 16px 6px;
  position:sticky;top:0;z-index:5;
  background:linear-gradient(180deg,#000 72%,rgba(0,0,0,0));
}
.search-wrap{position:relative;display:flex;align-items:center;}
.search-wrap svg{
  position:absolute;left:13px;width:17px;height:17px;color:var(--muted-2);pointer-events:none;
}
.search-input{
  width:100%;padding:12px 14px 12px 38px;border-radius:13px;
  background:var(--surface-2);border:1px solid var(--line);
  color:var(--text);font-size:14px;outline:none;
}
.search-input:focus{border-color:rgba(217,179,108,.45);}
.search-input::placeholder{color:var(--muted-2);}

.chips{display:flex;gap:7px;padding:10px 16px 4px;overflow-x:auto;}
.chip{
  padding:7px 13px;border-radius:999px;font-size:12px;font-weight:600;
  background:var(--surface-2);border:1px solid var(--line);
  color:var(--muted);cursor:pointer;white-space:nowrap;
  transition:all .18s;
}
.chip.on{background:var(--gold-soft);border-color:rgba(217,179,108,.5);color:var(--gold);}

.ucard{
  margin:10px 16px;padding:14px;border-radius:18px;
  background:var(--surface-2);border:1px solid var(--line);
  animation:vfade .25s ease;
}
.ucard-top{display:flex;align-items:center;gap:12px;cursor:pointer;}
.ucard-id{flex:1;min-width:0;}
.ucard-alias{font-size:15px;font-weight:680;letter-spacing:-0.015em;}
.ucard-tier{font-size:11px;color:var(--muted);margin-top:2px;}
.tier-tag{
  display:inline-block;padding:2px 7px;border-radius:6px;font-size:9.5px;
  font-weight:800;letter-spacing:.06em;text-transform:uppercase;
}
.skills{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;}
.skill{
  font-size:11px;padding:4px 9px;border-radius:8px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  color:var(--muted);
}
.ucard-actions{display:flex;gap:7px;margin-top:12px;}
.ucard-actions .btn{flex:1;padding:10px 6px;font-size:12px;}
.ucard-actions .btn.iconic{flex:none;width:42px;padding:10px 0;}
.ucard-actions .btn svg{width:16px;height:16px;}

.empty{
  text-align:center;padding:52px 30px;color:var(--muted-2);
}
.empty .ico{font-size:34px;opacity:.5;margin-bottom:12px;}
.empty p{font-size:13px;margin:0;line-height:1.5;}

/* ============================================================
   PROFILE VIEW
============================================================ */
.prof-head{
  padding:26px 20px 22px;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  background:
    radial-gradient(90% 100% at 50% 0%, rgba(217,179,108,.13), transparent 70%);
  border-bottom:1px solid var(--line);
}
.prof-alias{font-size:22px;font-weight:760;letter-spacing:-0.03em;margin-top:14px;}
.prof-code{font-size:14px;color:var(--gold);font-weight:650;margin-top:5px;letter-spacing:.02em;}
.prof-bio{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:12px;max-width:280px;}
.stats{display:flex;gap:10px;margin-top:18px;width:100%;}
.stat{
  flex:1;padding:12px 6px;border-radius:14px;
  background:rgba(255,255,255,.045);border:1px solid var(--line);
}
.stat .n{font-size:18px;font-weight:750;letter-spacing:-0.02em;}
.stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:3px;font-weight:700;}

.list-group{margin:14px 16px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);}
.list-item{
  display:flex;align-items:center;gap:12px;padding:14px 15px;
  border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;
  transition:background .15s;
}
.list-item:last-child{border-bottom:none;}
.list-item:active{background:rgba(255,255,255,.05);}
.list-item .li-ico{width:22px;text-align:center;font-size:15px;opacity:.9;}
.list-item .li-val{margin-left:auto;color:var(--muted-2);font-size:12.5px;}

/* ============================================================
   OVERLAYS
============================================================ */
#stack{position:absolute;inset:0;pointer-events:none;z-index:60;}
#stack .overlay{
  position:absolute;inset:0;background:var(--bg);
  pointer-events:auto;display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform .34s cubic-bezier(.32,.72,0,1);
  will-change:transform;
}
#stack .overlay.in{transform:none;}
#stack .overlay.sheet{
  transform:translateY(100%);
  border-radius:26px 26px 0 0;
  background:var(--surface);
  border-top:1px solid var(--line-strong);
  max-height:88%;
  box-shadow:0 -30px 80px rgba(0,0,0,.7);
}
#stack .overlay.sheet.in{transform:none;}

.sheet-handle{
  width:38px;height:4px;border-radius:2px;background:var(--elevated-2);
  margin:10px auto 4px;flex:none;
}
.sheet-title{
  font-size:16px;font-weight:720;letter-spacing:-0.02em;
  padding:8px 20px 14px;text-align:center;
}

/* CHAT HEADER */
.chat-head{
  flex:none;display:flex;align-items:center;gap:11px;
  padding:calc(var(--sat) + 9px) 12px 9px;
  background:rgba(0,0,0,.8);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border-bottom:1px solid var(--line);
  z-index:5;
}
.chat-head-id{flex:1;min-width:0;cursor:pointer;}
.chat-head-id .n{font-size:14.5px;font-weight:660;letter-spacing:-0.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-head-id .c{font-size:11px;color:var(--gold);font-weight:600;margin-top:1px;}
.chat-head-id .c.grey{color:var(--muted);}

/* MESSAGES */
.msgs{
  flex:1;overflow-y:auto;padding:18px 14px 10px;
  display:flex;flex-direction:column;gap:3px;
  background:
    radial-gradient(120% 60% at 50% 0%, rgba(217,179,108,.045), transparent 60%),
    var(--bg);
}
.day-sep{
  align-self:center;font-size:10.5px;color:var(--muted-2);
  background:rgba(255,255,255,.05);padding:4px 11px;border-radius:999px;
  margin:10px 0 8px;font-weight:600;letter-spacing:.03em;
}
.msg-wrap{display:flex;flex-direction:column;max-width:80%;}
.msg-wrap.me{align-self:flex-end;align-items:flex-end;}
.msg-wrap.them{align-self:flex-start;align-items:flex-start;}
.msg-sender{font-size:10.5px;color:var(--gold);font-weight:700;margin:8px 0 3px 12px;letter-spacing:.02em;}
.msg{
  padding:9px 13px;border-radius:19px;
  font-size:14.5px;line-height:1.42;
  word-break:break-word;
  animation:pop .22s cubic-bezier(.2,.9,.3,1.2);
  position:relative;
}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97);}to{opacity:1;transform:none;}}
.msg.me{
  background:linear-gradient(135deg,#eed9a6,#c69d51);
  color:#1c1509;border-bottom-right-radius:6px;
  box-shadow:0 3px 14px -6px rgba(217,179,108,.5);
}
.msg.them{
  background:var(--elevated);color:var(--text);
  border-bottom-left-radius:6px;border:1px solid rgba(255,255,255,.05);
}
.msg .t{font-size:9.5px;opacity:.55;margin-left:7px;float:right;margin-top:4px;font-weight:600;}
.msg.me .t{color:#4a3a18;}

.typing{display:flex;gap:4px;padding:12px 15px;}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:tp 1.2s infinite;}
.typing i:nth-child(2){animation-delay:.18s;}
.typing i:nth-child(3){animation-delay:.36s;}
@keyframes tp{0%,60%,100%{opacity:.3;transform:translateY(0);}30%{opacity:1;transform:translateY(-3px);}}

/* COMPOSER */
.composer{
  flex:none;display:flex;align-items:center;gap:9px;
  padding:9px 12px calc(var(--sab) + 9px);
  background:rgba(8,8,10,.9);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border-top:1px solid var(--line);
}
.composer input{
  flex:1;padding:11px 16px;border-radius:22px;
  background:var(--elevated);border:1px solid var(--line);
  color:var(--text);font-size:14.5px;outline:none;
}
.composer input::placeholder{color:var(--muted-2);}
.send-btn{
  width:40px;height:40px;border-radius:50%;flex:none;
  display:grid;place-items:center;border:none;cursor:pointer;
  background:linear-gradient(135deg,#efd8a4,#c39a4e);
  color:#1a1408;transition:transform .14s,opacity .2s;
}
.send-btn:active{transform:scale(.88);}

  requestAnimationFrame(()=>requestAnimationFrame(()=>node.classList.add('in')));

}

  if(!node) return;
  node.classList.remove('in');

function genCode(tierKey){
  const digits = TIERS[tierKey].digits;
  const taken = new Set(USERS.map(u=>u.code));
  let code;
  do{
    if(digits===9){
      code = '100' + String(Math.floor(Math.random()*1000000)).padStart(6,'0');
    } else {
      const min = Math.pow(10, digits-1);
      const max = Math.pow(10, digits)-1;
      code = String(Math.floor(min + Math.random()*(max-min+1))).padStart(digits,'0');
    }
  } while(taken.has(code));
  return code;
}

function matches(u, q, filter){
  if(!q) return true;
  const query = q.toLowerCase().replace(/[<>]/g,'').trim();
  if(!query) return true;
  const codeHit  = u.code.toLowerCase().includes(query);
  const aliasHit = u.alias.toLowerCase().includes(query);
  const skillHit = u.skills.some(s=>s.toLowerCase().includes(query));
  if(filter==='code')  return codeHit;
  if(filter==='alias') return aliasHit;
  if(filter==='skill') return skillHit;
  return codeHit || aliasHit || skillHit;
}

function getConvo(id){
  const [type,key] = id.split(':');
  if(type==='dm')  return store.dms.find(d=>d.code===key);
  if(type==='grp') return store.groups.find(g=>g.id===key);
  if(type==='ch')  return store.channels.find(c=>c.id===key);
  return null;
}

function convoMeta(id){
  const [type,key] = id.split(':');
  if(type==='dm'){
    const u = userByCode(key);
    return {title:u.alias, code:u.code, avatar:avatarHTML(u,'sm'), kind:'dm', peer:u};
  }
  if(type==='grp'){
    const g = store.groups.find(x=>x.id===key);
    return {title:g.name, code:g.members.length+' members · '+g.members.map(c=>userByCode(c).alias).join(', '),
            avatar:`<div class="avatar sm" style="--h:${g.hue}">${g.emoji}</div>`, kind:'grp', group:g};
  }
  const c = store.channels.find(x=>x.id===key);
  return {title:c.name, code:c.desc, avatar:`<div class="avatar sm" style="--h:${c.hue}">${c.emoji}</div>`, kind:'ch', channel:c};
}

  const meta = convoMeta(id);
  const isChannel = meta.kind === 'ch';

  const ov = pushOverlay(`

      <div class="chat-head-id" data-act="chat-info" data-id="${id}">

          <div class="c ${meta.kind==='dm'?'':'grey'}">${meta.kind==='dm'?`&lt;&gt; ${meta.code}`:esc(meta.code)}</div>
        </div>
      </div>
      ${meta.kind==='dm' ? `
        <button class="icon-btn" data-act="call" data-code="${meta.peer.code}" data-mode="voice" style="color:var(--gold)">${I.phone}</button>
        <button class="icon-btn" data-act="call" data-code="${meta.peer.code}" data-mode="video" style="color:var(--gold)">${I.video}</button>

      `}

    ${isChannel
      ? `<div class="channel-note">📡 Only the channel owner can post in <b>${esc(meta.title)}</b></div>`
      : `<div class="composer">
           <input id="msgInput" placeholder="Message" autocomplete="off">
           <button class="send-btn" data-act="send" data-id="${id}">${I.send}</button>
         </div>`}
  `);

  ov.dataset.chatId = id;
  const msgs = $('#msgs', ov);
  msgs.innerHTML = renderMessages(convo, meta);
  requestAnimationFrame(()=>{ msgs.scrollTop = msgs.scrollHeight; });

  if(!isChannel){
    const input = $('#msgInput', ov);
    input.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ e.preventDefault(); sendMessage(id); }
    });
    setTimeout(()=>input.focus(), 380);
  }
  return ov;
}

function renderMessages(convo, meta){
  let html = '';
  let lastDay = null;
  convo.messages.forEach(m=>{
    const mine = m.from === 'me';
    const day = /^\d{2}:\d{2}$/.test(m.time) ? 'Today' : m.time;
    if(day !== lastDay){
      html += `<div class="day-sep">${day}</div>`;
      lastDay = day;
    }
    const sender = (!mine && meta.kind !== 'dm') ? `<div class="msg-sender">${userByCode(m.from).alias}&lt;&gt;${m.from}</div>` : '';
    html += `
      <div class="msg-wrap ${mine?'me':'them'}">
        ${sender}
        <div class="msg ${mine?'me':'them'}">${esc(m.text)}<span class="t">${m.time}</span></div>
      </div>`;
  });
  return html;
}

/* ============================================================
   SEND MESSAGE
============================================================ */
const REPLIES = [
  'Understood. I’ll confirm within the hour.',
  'Noted — logging it on the Source desk.',
  'That works. Sending the file now.',
  'Copy. Let’s keep the window tight.',
  'Agreed. I’ll loop in the Makers tier.',
  'Received. Code verified on my side.',
  'Good. I’ll hold the line until 18:00.'
];

function sendMessage(id){
  const ov = $$('#stack .overlay').find(o=>o.dataset.chatId===id);
  if(!ov) return;
  const input = $('#msgInput', ov);
  const text = input.value.trim();
  if(!text) return;

  const convo = getConvo(id);
  const time = nowTime();
  convo.messages.push({from:'me', text, time});
  input.value = '';

  const msgs = $('#msgs', ov);
  const meta = convoMeta(id);
  msgs.innerHTML = renderMessages(convo, meta);
  msgs.scrollTop = msgs.scrollHeight;

  renderChats(); renderGroups();

  // Simulated reply for DMs
  const [type, key] = id.split(':');
  if(type === 'dm'){
    const peer = userByCode(key);
    setTimeout(()=>{
      const stillOpen = $$('#stack .overlay').find(o=>o.dataset.chatId===id);
      if(stillOpen){
        const m = $('#msgs', stillOpen);
        m.insertAdjacentHTML('beforeend', `
          <div class="msg-wrap them">
            <div class="msg them typing"><i></i><i></i><i></i></div>
          </div>`);
        m.scrollTop = m.scrollHeight;
      }
    }, 900);

    setTimeout(()=>{
      const reply = REPLIES[Math.floor(Math.random()*REPLIES.length)];
      convo.messages.push({from:key, text:reply, time:nowTime()});
      const stillOpen = $$('#stack .overlay').find(o=>o.dataset.chatId===id);
      if(stillOpen){
        const m = $('#msgs', stillOpen);
        m.innerHTML = renderMessages(convo, convoMeta(id));
        m.scrollTop = m.scrollHeight;
      } else {
        convo.unread = (convo.unread||0) + 1;
        toast(peer.alias + '<>' + peer.code, reply, peer.emoji);
      }
      renderChats(); renderTabbar();
    }, 2400);
  }
}

/* ============================================================
   CALL SCREEN
============================================================ */
let callTimer = null;

function startCall(code, mode){
  const u = userByCode(code);
  const node = document.createElement('div');
  node.id = 'callScreen';
  node.innerHTML = `
    <div class="call-avatar" style="--h:${u.hue}">${u.emoji}</div>
    <div class="call-name">${u.alias}</div>
    <div class="call-code">&lt;&gt; ${u.code}</div>
    <div class="call-status" id="callStatus">Calling…</div>
    <div class="call-ctrl">
      <button class="cbtn" data-c="mute">${I.mic}</button>
      <button class="cbtn end" data-c="end">${I.phone}</button>
      <button class="cbtn" data-c="spk">${I.vol}</button>
    </div>
  `;
  $('#phone').appendChild(node);

  let secs = 0;
  let connected = false;

  setTimeout(()=>{
    connected = true;
    const st = $('#callStatus', node);
    if(!st) return;
    st.textContent = '00:00';
    callTimer = setInterval(()=>{
      secs++;
      const mm = String(Math.floor(secs/60)).padStart(2,'0');
      const ss = String(secs%60).padStart(2,'0');
      const s = $('#callStatus', node);
      if(s) s.textContent = `${mm}:${ss}`;
    }, 1000);
    toast('Call connected', `${u.alias}<>${u.code} · ${mode} call`, '📞');
  }, 2200);

  node.addEventListener('click', e=>{
    const btn = e.target.closest('[data-c]');
    if(!btn) return;
    const c = btn.dataset.c;
    if(c === 'end'){
      clearInterval(callTimer); callTimer = null;
      const dur = connected ? `${Math.floor(secs/60)}m ${secs%60}s` : '';
      if(connected){
        store.calls.unshift({code:u.code, mode, dir:'out', time:nowTime(), dur});
        renderCalls();
      }
      node.style.transition='opacity .25s, transform .25s';
      node.style.opacity='0'; node.style.transform='scale(.96)';
      setTimeout(()=>node.remove(), 260);
    } else {
      btn.classList.toggle('on');
      btn.innerHTML = btn.classList.contains('on')
        ? (c==='mute' ? I.micOff : c==='spk' ? I.vol : I.camOff)
        : (c==='mute' ? I.mic : c==='spk' ? I.vol : I.camOff);
    }
  });
}

/* ============================================================
   GROUP MODAL
============================================================ */
let draftGroup = { name:'', members:[] };

function openNewGroup(){
  draftGroup = { name:'', members:[] };
  const ov = pushOverlay(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">New Group</div>
    <div class="scroll" style="flex:1;padding:0 16px 10px">
      <div class="label">Group name</div>
      <input class="field" id="grpName" placeholder="e.g. DEAL ROOM 09" maxlength="22" autocomplete="off">

      <div class="label" style="margin-top:18px">Invite members by Code ID</div>
      <div style="display:flex;gap:8px">
        <input class="field" id="grpCode" placeholder="001 / 1008 / 01" autocomplete="off" style="flex:1">
        <button class="btn gold" data-act="grp-add" style="padding:13px 16px">Add</button>
      </div>
      <div id="grpChips" style="margin-top:14px"></div>

      <div class="label" style="margin-top:20px">Suggestions</div>
      <div id="grpSuggest"></div>
    </div>
    <div style="padding:12px 16px calc(var(--sab) + 16px);border-top:1px solid var(--line)">
      <button class="btn gold block" data-act="grp-create">Create group</button>
    </div>
  `, {sheet:true});

  const renderDraft = ()=>{
    const chips = $('#grpChips', ov);
    chips.innerHTML = draftGroup.members.length
      ? draftGroup.members.map(c=>{
          const u = userByCode(c);
          return `<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:8px">
            ${avatarHTML(u,'sm')}
            <div style="flex:1;font-size:13.5px;font-weight:620">${u.alias}<span class="sep">&lt;&gt;</span><span class="code-txt">${u.code}</span></div>
            <button class="icon-btn" data-act="grp-remove" data-code="${c}" style="width:30px;height:30px;color:var(--muted)">${I.x}</button>
          </div>`;
        }).join('')
      : `<div style="font-size:12px;color:var(--muted-2)">No members added yet.</div>`;

    const sug = $('#grpSuggest', ov);
    const pool = USERS.filter(u=>u.code!==state.me.code && !draftGroup.members.includes(u.code)).slice(0,6);
    sug.innerHTML = pool.map(u=>`
      <div class="row" style="padding:9px 0" data-act="grp-quick" data-code="${u.code}">
        ${avatarHTML(u,'sm')}
        <div class="row-body">
          <div style="font-size:13.5px;font-weight:620">${u.alias}<span class="sep">&lt;&gt;</span><span class="code-txt">${u.code}</span></div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">${TIERS[u.tier].name} · ${u.skills[0]}</div>
        </div>
        <div style="color:var(--gold);font-size:20px;font-weight:300">+</div>
      </div>`).join('');
  };
  renderDraft();
  ov._renderDraft = renderDraft;

  const nameInput = $('#grpName', ov);
  nameInput.addEventListener('input', e=>{ draftGroup.name = e.target.value; });
  const codeInput = $('#grpCode', ov);
  codeInput.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ e.preventDefault(); addByCode(); }
  });
  ov._addByCode = addByCode;

  function addByCode(){
    const v = codeInput.value.trim().replace(/[^0-9]/g,'');
    if(!v) return;
    const u = USERS.find(x=>x.code === v);
    if(!u){ toast('Code not found', `No node with Code ID ${v}`, '⚠️'); return; }
    if(u.code === state.me.code){ toast('That’s you', 'You are already in the group', '🙂'); return; }
    if(draftGroup.members.includes(u.code)){ toast('Already added', `${u.alias}<>${u.code}`, 'ℹ️'); return; }
    draftGroup.members.push(u.code);
    codeInput.value = '';
    renderDraft();
  }
}

/* ============================================================
   GLOBAL EVENT DELEGATION
============================================================ */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;

  switch(act){
    /* onboarding */
    case 'ob-next':
      obState.step = Math.min(3, obState.step + 1);
      renderOnboard();
      break;
    case 'ob-back':
      obState.step = Math.max(1, obState.step - 1);
      renderOnboard();
      break;
    case 'ob-tier':
      obState.tier = el.dataset.tier;
      renderOnboard();
      break;
    case 'ob-demo':
      startDemo();
      break;
    case 'ob-create': {
      const aliasEl = $('#obAlias');
      const alias = (aliasEl.value.trim().toUpperCase() || ALIAS_POOL[Math.floor(Math.random()*ALIAS_POOL.length)]);
      const code = $('#obCode').textContent.trim();
      const tier = TIERS[obState.tier];
      enterApp({
        code, alias, tier: tier.key,
        emoji: tier.icon, hue: 35,
        skills:['New Node'],
        bio: `New ${tier.name} node on the CODE1008 network.`
      });
      break;
    }

    /* tabs */
    case 'tab':
      setTab(el.dataset.tab);
      break;

    /* conversations */
    case 'open-dm': {
      const code = el.dataset.code;
      if(code === state.me.code) return;
      if(!store.dms.find(d=>d.code===code)){
        store.dms.unshift({code, unread:0, messages:[
          {from:code, text:`Connected. This is ${userByCode(code).alias}<>${code}.`, time:nowTime()}
        ]});
      }
      openChat('dm:'+code);
      break;
    }
    case 'open-group':
      openChat('grp:'+el.dataset.id);
      break;
    case 'open-channel':
      openChat('ch:'+el.dataset.id);
      break;
    case 'send':
      sendMessage(el.dataset.id);
      break;
    case 'close-ov': {
      const ov = el.closest('.overlay');
      closeOverlay(ov);
      break;
    }
    case 'chat-info':
    case 'group-info': {
      const id = el.dataset.id;
      const [type,key] = id.split(':');
      if(type==='dm') openProfile(key);
      else if(type==='grp'){
        const g = store.groups.find(x=>x.id===key);
        pushOverlay(`
          <header class="chat-head">
            <button class="icon-btn" data-act="close-ov">${I.back}</button>
            <div class="chat-head-id"><div class="n">${esc(g.name)}</div><div class="c grey">${g.members.length} members</div></div>
          </header>
          <div class="scroll" style="flex:1;padding:8px 0 24px">
            <div style="display:flex;justify-content:center;padding:22px 0 8px">
              <div class="avatar xl" style="--h:${g.hue}">${g.emoji}</div>
            </div>
            <div style="text-align:center;font-size:20px;font-weight:750;letter-spacing:-0.03em">${esc(g.name)}</div>
            <div style="text-align:center;font-size:12px;color:var(--muted);margin-top:6px">Group · ${g.members.length} Code IDs</div>
            <div class="section-head">Members</div>
            ${g.members.map(c=>{
              const u = userByCode(c);
              return `<div class="row" data-act="open-profile" data-code="${u.code}">
                ${avatarHTML(u,'sm')}
                <div class="row-body">
                  <div class="row-name">${u.alias}<span class="sep">&lt;&gt;</span><span class="row-code">${u.code}</span></div>
                  <div class="row-prev">${TIERS[u.tier].name}${c===state.me.code?' · You':''}</div>
                </div>
              </div>`;
            }).join('')}
            <div style="padding:18px 16px 0">
              <button class="btn block" data-act="new-group">${I.plus} Invite more members</button>
            </div>
          </div>
        `);
      } else {
        const c = store.channels.find(x=>x.id===key);
        toast(c.name, c.desc, c.emoji);
      }
      break;
    }

    /* discover */
    case 'disc-filter':
      state.discoverFilter = el.dataset.filter;
      renderDiscover();
      break;
    case 'open-profile':
      openProfile(el.dataset.code);
      break;

    /* calls */
    case 'call':
      startCall(el.dataset.code, el.dataset.mode);
      break;

    /* groups */
    case 'new-group':
      openNewGroup();
      break;
    case 'grp-add': {
      const ov = el.closest('.overlay');
      ov._addByCode();
      break;
    }
    case 'grp-quick': {
      const code = el.dataset.code;
      if(!draftGroup.members.includes(code)) draftGroup.members.push(code);
      const ov = el.closest('.overlay');
      ov._renderDraft();
      break;
    }
    case 'grp-remove': {
      draftGroup.members = draftGroup.members.filter(c=>c !== el.dataset.code);
      const ov = el.closest('.overlay');
      ov._renderDraft();
      break;
    }
    case 'grp-create': {
      const nameEl = $('#grpName');
      const name = (nameEl ? nameEl.value.trim() : draftGroup.name).toUpperCase() || 'NEW GROUP';
      if(draftGroup.members.length === 0){
        toast('Add members', 'Invite at least one Code ID', '⚠️');
        return;
      }
      const g = {
        id: 'g' + Date.now(),
        name,
        emoji: '🗂️',
        hue: Math.floor(Math.random()*360),
        unread: 0,
        members: [state.me.code, ...draftGroup.members],
        messages: [{from:'me', text:`Group created. ${draftGroup.members.length} Code ID(s) invited.`, time:nowTime()}]
      };
      store.groups.unshift(g);
      renderGroups(); renderProfileView();
      closeOverlay(el.closest('.overlay'));
      toast('Group created', `${name} · ${g.members.length} members`, '👥');
      setTimeout(()=>openChat('grp:'+g.id), 320);
      break;
    }

    /* invite */
    case 'invite':
      openInvite(el.dataset.code);
      break;
    case 'do-invite': {
      const g = store.groups.find(x=>x.id === el.dataset.group);
      const u = userByCode(el.dataset.code);
      if(g && !g.members.includes(u.code)){
        g.members.push(u.code);
        g.messages.push({from:'me', text:`${u.alias}<>${u.code} was added to the group.`, time:nowTime()});
        renderGroups();
        toast('Member added', `${u.alias}<>${u.code} → ${g.name}`, '✅');
      }
      closeOverlay(el.closest('.overlay'));
      break;
    }

    /* notifications */
    case 'notifs':
      openNotifs();
      break;

    /* profile */
    case 'edit-profile':
      openEditProfile();
      break;
    case 'ep-save': {
      const ov = el.closest('.overlay');
      const a = $('#epAlias', ov).value.trim().toUpperCase();
      const b = $('#epBio', ov).value.trim();
      if(a) state.me.alias = a;
      state.me.bio = b;
      renderProfileView(); renderTopbar();
      closeOverlay(ov);
      toast('Profile updated', `${state.me.alias}<>${state.me.code}`, '✅');
      break;
    }
    case 'share-id':
      toast('Code ID copied', `${state.me.alias}<>${state.me.code}`, '🔗');
      break;
    case 'signout': {
      const ov = pushOverlay(`
        <div class="sheet-handle"></div>
        <div class="sheet-title">Sign out?</div>
        <div style="padding:0 20px 8px;text-align:center;font-size:13px;color:var(--muted);line-height:1.55">
          Your Code ID <b style="color:var(--gold)">${state.me.alias}&lt;&gt;${state.me.code}</b> will remain reserved on the network.
        </div>
        <div style="padding:16px 16px calc(var(--sab) + 16px)">
          <button class="btn block" style="background:linear-gradient(135deg,#ff5f52,#d92b1f);color:#fff" data-act="do-signout">Sign out</button>
          <button class="btn ghost block" data-act="close-ov" style="margin-top:9px">Cancel</button>
        </div>
      `, {sheet:true});
      break;
    }
    case 'do-signout':
      closeOverlay(el.closest('.overlay'));
      $$('#stack .overlay').forEach(o=>closeOverlay(o));
      setTimeout(()=>{
        state.me = null;
        $('#app').hidden = true;
        $('#onboard').hidden = false;
        obState.step = 1;
        renderOnboard();
      }, 260);
      break;

    /* misc */
    case 'new-chat':
      setTab('discover');
      setTimeout(()=>{ const i = $('#discInput'); if(i) i.focus(); }, 120);
      break;
    case 'soon':
      toast('Coming soon', 'This module is not part of the prototype', '🔒');
      break;
  }
});

/* ============================================================
   BOOT
============================================================ */
renderOnboard();
</script>
