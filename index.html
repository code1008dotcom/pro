    background: var(--text);
    color: var(--bg);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .profile-actions {
    display: flex;
    gap: 8px;
    padding: 16px;
  }
  .profile-actions .btn {
    flex: 1;
    padding: 12px 8px;
    font-size: 13px;
    border-radius: 12px;
    flex-direction: column;
    gap: 4px;
  }
  .profile-actions .btn .act-emoji { font-size: 18px; }

  .kv-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);

  }
  .kv-row .k { font-size: 13.5px; color: var(--text-2); flex-shrink: 0; }
  .kv-row .v { font-size: 13.5px; color: var(--text); font-weight: 500; text-align: right; }
  .kv-row .v.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }

  .tag-row {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 4px 0 0;
  }
  .tag {
    padding: 5px 12px;
    border-radius: 20px;
    background: var(--surface-2);
    color: var(--text-2);
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--border);
  }

  /* ---------- MODAL ---------- */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .modal-backdrop.show { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--surface);
    border-radius: 24px;
    padding: 24px 20px 20px;
    width: 100%;
    max-width: 380px;
    box-shadow: var(--shadow-lg);
    transform: scale(.95);
    transition: transform .2s;
  }
  .modal-backdrop.show .modal { transform: scale(1); }
  .modal h3 { font-size: 18px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 6px; text-align: center; }
  .modal p { font-size: 13.5px; color: var(--text-2); text-align: center; margin-bottom: 18px; line-height: 1.5; }

  /* ---------- UTIL ---------- */
  .hidden { display: none !important; }
  .text-center { text-align: center; }
  .mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; }
  .mb-8 { margin-bottom: 8px; } .mb-12 { margin-bottom: 12px; } .mb-16 { margin-bottom: 16px; } .mb-24 { margin-bottom: 24px; }
  .px-16 { padding-left: 16px; padding-right: 16px; }
  .muted { color: var(--text-2); }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  ::-webkit-scrollbar { width: 0; height: 0; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: calc(100px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--bg);
    padding: 10px 20px;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 600;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    white-space: nowrap;
    box-shadow: var(--shadow-lg);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
