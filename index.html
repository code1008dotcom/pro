<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>1008 — Private Communication Network</title>
<style>
/* ============================================================
   TOKENS
============================================================ */
:root{
  --ink:#0a0a0b;
  --ink2:#3c3c43;
  --muted:#8a8a8e;
  --muted2:#b4b4ba;
  --line:#ececef;
  --line2:#f5f5f7;
  --surface:#fafafa;
  --gold:#c6a15b;
  --gold-d:#a8813c;
  --gold-s:#f9f4ea;
  --green:#34c759;
  --red:#ff3b30;
  --blue:#0a84ff;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --shadow:0 18px 40px -22px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
[hidden]{display:none !important;}
html,body{height:100%;}
body{
  margin:0;
  background:#ffffff;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-0.012em;
  display:flex;
  justify-content:center;
  align-items:stretch;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;}
input,textarea{font-family:inherit;}
::-webkit-scrollbar{width:0;height:0;display:none;}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}

/* ============================================================
   APP SHELL
============================================================ */
.app{
  position:relative;
  width:100%;
  max-width:430px;
  height:100dvh;
  background:#fff;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
@media (min-width:560px){
  body{align-items:center;padding:22px 0;background:#ffffff;}
  .app{
    height:min(920px,calc(100dvh - 44px));
    border-radius:34px;
    border:1px solid var(--line);
    box-shadow:0 40px 90px -40px rgba(0,0,0,.28), 0 2px 0 0 rgba(255,255,255,.8) inset;
  }
}
.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  background:#fff;
}

/* ============================================================
   LOGO
============================================================ */
.logo-mark{
  display:grid;place-items:center;
  background:#0a0a0b;
  color:#e7c98a;
  font-weight:800;
  letter-spacing:-.06em;
  border-radius:14px;
  font-size:12px;
  width:38px;height:38px;
  flex:none;
  box-shadow:0 6px 16px -8px rgba(0,0,0,.6);
}
.logo-mark.xl{
  width:96px;height:96px;font-size:28px;border-radius:28px;
  background:linear-gradient(150deg,#1a1a1c,#000);
  box-shadow:0 26px 50px -20px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.06);
}
.logo-mark.sm{width:32px;height:32px;font-size:10px;border-radius:11px;}

/* ============================================================
   SPLASH
============================================================ */
.splash{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(var(--sat) + 30px) 30px calc(var(--sab) + 30px);
  text-align:center;gap:0;
}
.splash .brand{
  font-size:44px;font-weight:800;letter-spacing:-.05em;margin:26px 0 0;
}
.splash .brand-sub{
  font-size:15px;color:var(--muted);margin:10px 0 0;font-weight:500;
  letter-spacing:-.01em;
}
.splash .rule{
  width:44px;height:1px;background:var(--gold);opacity:.55;margin:26px 0;
}
.splash .tag{
  font-size:13px;color:var(--muted);line-height:1.6;max-width:270px;margin:0;
}
.splash .spacer{flex:1;}
.splash-cta{width:100%;max-width:340px;}
.fine{font-size:11.5px;color:var(--muted2);margin:14px 0 0;letter-spacing:.01em;}

/* ============================================================
   BUTTONS
============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:none;border-radius:15px;
  padding:15px 20px;font-size:15px;font-weight:600;
  transition:transform .12s ease, opacity .2s, background .2s;
  letter-spacing:-.01em;
}
.btn:active{transform:scale(.97);}
.btn.primary{background:#0a0a0b;color:#fff;}
.btn.gold{background:linear-gradient(150deg,#e2c489,#c6a15b 55%,#a8813c);color:#221a09;}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
.btn.soft{background:var(--surface);border:1px solid var(--line);color:var(--ink);}
.btn.block{width:100%;}
.btn.sm{padding:10px 14px;font-size:13px;border-radius:12px;}
.btn.tiny{padding:8px 12px;font-size:12px;border-radius:10px;font-weight:600;}

/* ============================================================
   NAV / TOPBAR
============================================================ */
.topbar{
  flex:none;display:flex;align-items:center;gap:11px;
  padding:calc(var(--sat) + 11px) 16px 11px;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--line);
  z-index:20;
}
.topbar .lock{display:flex;align-items:center;gap:9px;}
.topbar .lock .txt{font-size:17px;font-weight:800;letter-spacing:-.04em;}
.topbar .grow{flex:1;}
.icon-btn{
  width:38px;height:38px;border-radius:12px;flex:none;
  display:grid;place-items:center;
  background:transparent;border:none;color:var(--ink);
  transition:background .16s, transform .12s;position:relative;
}
.icon-btn:active{background:var(--line2);transform:scale(.93);}
.icon-btn svg{width:21px;height:21px;}
.icon-btn.muted{color:var(--muted);}
.dot-badge{
  position:absolute;top:5px;right:5px;
  min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:var(--gold);color:#1a1408;font-size:10px;font-weight:800;
  display:grid;place-items:center;border:2px solid #fff;
}
.nav{
  flex:none;display:flex;align-items:center;gap:10px;
  padding:calc(var(--sat) + 10px) 14px 10px;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.nav-title{font-size:16px;font-weight:700;letter-spacing:-.02em;}

/* ============================================================
   VIEWS
============================================================ */
.views{flex:1;position:relative;overflow:hidden;}
.view{
  position:absolute;inset:0;overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-bottom:26px;display:none;
}
.view.active{display:block;animation:vIn .24s ease;}
@keyframes vIn{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}

.big-title{
  font-size:31px;font-weight:800;letter-spacing:-.04em;
  padding:16px 18px 2px;margin:0;
}
.big-sub{font-size:13.5px;color:var(--muted);padding:6px 18px 0;margin:0;line-height:1.5;}
.sec{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:22px 18px 10px;
}
.sec h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.025em;}
.sec .link{font-size:13px;font-weight:600;color:var(--gold-d);background:none;border:none;padding:0;}

/* ============================================================
   CARDS
============================================================ */
.card{
  background:#fff;border:1px solid var(--line);border-radius:20px;
  padding:16px;margin:0 18px;
}
.welcome{
  margin:14px 18px 0;border-radius:22px;padding:20px;
  background:linear-gradient(150deg,#0d0d0f,#000);
  color:#fff;position:relative;overflow:hidden;
}
.welcome::after{
  content:'';position:absolute;right:-50px;top:-60px;width:180px;height:180px;
  border-radius:50%;background:radial-gradient(circle,rgba(198,161,91,.45),transparent 68%);
}
.welcome .wtop{display:flex;align-items:center;gap:12px;position:relative;}
.welcome .wtitle{font-size:17px;font-weight:700;letter-spacing:-.025em;}
.welcome .wsub{font-size:12.5px;color:rgba(255,255,255,.62);margin-top:3px;}
.welcome .wcode{
  display:inline-flex;align-items:center;gap:6px;margin-top:16px;
  font-size:12.5px;font-weight:600;color:#e7c98a;
  background:rgba(198,161,91,.14);border:1px solid rgba(198,161,91,.3);
  padding:7px 12px;border-radius:10px;position:relative;
}
.welcome .wstats{display:flex;gap:22px;margin-top:18px;position:relative;}
.welcome .wstat .n{font-size:19px;font-weight:800;letter-spacing:-.03em;}
.welcome .wstat .l{font-size:10.5px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.1em;margin-top:3px;font-weight:700;}

/* ============================================================
   AVATARS
============================================================ */
.av{
  border-radius:50%;display:grid;place-items:center;flex:none;
  background:hsl(var(--h,220) 52% 96%);
  border:1px solid hsl(var(--h,220) 32% 90%);
  background-size:cover;background-position:center;
  line-height:1;overflow:hidden;user-select:none;
}
.av-sm{width:40px;height:40px;font-size:18px;}
.av-md{width:50px;height:50px;font-size:22px;}
.av-lg{width:78px;height:78px;font-size:34px;}
.av-xl{width:108px;height:108px;font-size:48px;}

/* ============================================================
   BADGES
============================================================ */
.badge{
  display:inline-block;padding:4px 9px;border-radius:8px;
  font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid transparent;
}
.badge.gold{color:#8d6a28;background:var(--gold-s);border-color:rgba(198,161,91,.35);}
.badge.ink{color:#fff;background:#0a0a0b;border-color:#0a0a0b;}
.badge.grey{color:#5c5c61;background:#f4f4f6;border-color:#e8e8ec;}
.badge.bronze{color:#7a5a20;background:#f7efe0;border-color:rgba(168,129,60,.32);}

/* ============================================================
   ROWS / LISTS
============================================================ */
.row{
  display:flex;align-items:center;gap:13px;
  padding:12px 18px;cursor:pointer;transition:background .14s;
}
.row:active{background:var(--surface);}
.row-body{flex:1;min-width:0;}
.row-top{display:flex;align-items:baseline;gap:7px;}
.row-name{
  font-size:15px;font-weight:650;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.row-code{font-size:11.5px;color:var(--gold-d);font-weight:700;letter-spacing:0;}
.row-time{font-size:11.5px;color:var(--muted2);margin-left:auto;flex:none;padding-left:8px;font-weight:500;}
.row-prev{
  font-size:13px;color:var(--muted);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35;
}
.unread{
  min-width:20px;height:20px;padding:0 6px;border-radius:10px;
  background:#0a0a0b;color:#e7c98a;font-size:11px;font-weight:800;
  display:grid;place-items:center;flex:none;margin-left:6px;
}
.pin{font-size:11px;color:var(--muted2);flex:none;}

.empty{padding:54px 30px;text-align:center;color:var(--muted2);}
.empty .ico{font-size:32px;opacity:.5;margin-bottom:12px;}
.empty p{font-size:13.5px;margin:0;line-height:1.55;}

/* ============================================================
   HORIZONTAL SCROLLER
============================================================ */
.hscroll{
  display:flex;gap:12px;overflow-x:auto;padding:4px 18px 6px;
  scroll-snap-type:x mandatory;
}
.hcard{
  flex:none;width:158px;scroll-snap-align:start;
  border:1px solid var(--line);border-radius:20px;
  padding:16px 14px;background:#fff;
  display:flex;flex-direction:column;gap:9px;
  transition:transform .14s;
}
.hcard:active{transform:scale(.97);}
.hcard .hname{font-size:14.5px;font-weight:700;letter-spacing:-.02em;}
.hcard .hcode{font-size:11.5px;color:var(--gold-d);font-weight:700;}
.hcard .hdesc{font-size:11.5px;color:var(--muted);line-height:1.4;}

/* ============================================================
   IDENTITY CARDS
============================================================ */
.id-card{
  margin:12px 18px;border:1px solid var(--line);border-radius:22px;
  padding:18px;background:#fff;transition:transform .14s, border-color .2s, box-shadow .2s;
}
.id-card:active{transform:scale(.985);}
.id-card .top{display:flex;align-items:center;gap:12px;}
.id-card .glyph{
  width:48px;height:48px;border-radius:15px;display:grid;place-items:center;
  font-size:20px;flex:none;border:1px solid var(--line);background:var(--surface);
}
.id-card .name{font-size:16px;font-weight:750;letter-spacing:-.025em;}
.id-card .price{font-size:12.5px;font-weight:700;color:var(--gold-d);margin-top:3px;}
.id-card .desc{font-size:13px;color:var(--muted);line-height:1.5;margin:13px 0 0;}
.id-card .ex{
  display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;
}
.id-card .ex span{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11px;padding:5px 9px;border-radius:9px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink2);
  letter-spacing:.02em;
}
.id-card .meta{
  display:flex;align-items:center;gap:8px;margin-top:12px;
  font-size:11px;color:var(--muted2);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
}
.id-card .cta{margin-top:15px;}

/* ============================================================
   FORMS
============================================================ */
.form{padding:6px 18px 26px;}
.label{
  font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted2);margin:20px 0 8px 2px;
}
.field{
  width:100%;padding:14px 15px;border-radius:14px;
  border:1px solid var(--line);background:#fff;color:var(--ink);
  font-size:15px;outline:none;transition:border-color .2s, background .2s;
}
.field:focus{border-color:rgba(198,161,91,.6);background:#fffefb;}
.field::placeholder{color:var(--muted2);}
textarea.field{resize:none;line-height:1.55;min-height:88px;}
.photo-pick{
  display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 4px;
}
.photo-ring{
  width:104px;height:104px;border-radius:50%;
  border:1.5px dashed #d8d8dd;display:grid;place-items:center;
  background:var(--surface);font-size:38px;color:var(--muted2);
  cursor:pointer;background-size:cover;background-position:center;
  transition:border-color .2s;
}
.photo-ring:active{border-color:var(--gold);}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
.chip{
  padding:8px 12px;border-radius:11px;font-size:12.5px;font-weight:600;
  border:1px solid var(--line);background:#fff;color:var(--ink2);
  transition:all .16s;
}
.chip.on{background:#0a0a0b;border-color:#0a0a0b;color:#e7c98a;}
.chip.add{border-style:dashed;color:var(--muted);}
.chip .x{opacity:.5;margin-left:6px;font-weight:700;}

/* ============================================================
   SUCCESS
============================================================ */
.success{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(var(--sat) + 24px) 30px calc(var(--sab) + 30px);text-align:center;
}
.tick{
  width:74px;height:74px;border-radius:50%;display:grid;place-items:center;
  background:var(--gold-s);border:1px solid rgba(198,161,91,.35);
  color:var(--gold-d);font-size:30px;margin-bottom:24px;
}
.identity-card{
  margin-top:22px;padding:22px 20px;border-radius:22px;
  border:1px solid var(--line);background:var(--surface);width:100%;max-width:330px;
}
.identity-card .code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:12px;
}
.identity-card .code .c{color:var(--gold-d);}

/* ============================================================
   SEARCH / CHIPS
============================================================ */
.searchbar{padding:12px 18px 4px;}
.sb-wrap{position:relative;display:flex;align-items:center;}
.sb-wrap svg{position:absolute;left:13px;width:17px;height:17px;color:var(--muted2);pointer-events:none;}
.sb-input{
  width:100%;padding:13px 14px 13px 40px;border-radius:14px;
  border:1px solid var(--line);background:var(--surface);
  font-size:14.5px;outline:none;color:var(--ink);
}
.sb-input:focus{background:#fff;border-color:rgba(198,161,91,.55);}
.sb-input::placeholder{color:var(--muted2);}
.filter-chips{display:flex;gap:7px;padding:12px 18px 4px;overflow-x:auto;}

/* ============================================================
   DISCOVER CARDS
============================================================ */
.dcard{
  margin:11px 18px;padding:16px;border-radius:20px;
  border:1px solid var(--line);background:#fff;
  animation:vIn .24s ease;
}
.dcard-top{display:flex;align-items:center;gap:13px;cursor:pointer;}
.dcard .nm{font-size:15.5px;font-weight:700;letter-spacing:-.025em;}
.dcard .cd{font-size:11.5px;color:var(--gold-d);font-weight:700;margin-top:3px;}
.dcard .bio{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:11px;}
.skills{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;}
.skill{
  font-size:11px;padding:5px 9px;border-radius:9px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink2);font-weight:500;
}
.dcard-actions{display:flex;gap:8px;margin-top:14px;}
.dcard-actions .btn{flex:1;padding:11px 6px;font-size:12.5px;border-radius:12px;}
.dcard-actions .btn.iconic{flex:none;width:44px;padding:11px 0;}
.dcard-actions svg{width:17px;height:17px;}

/* ============================================================
   TABBAR
============================================================ */
.tabbar{
  flex:none;display:flex;
  padding:9px 6px calc(var(--sab) + 9px);
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(26px) saturate(180%);
  -webkit-backdrop-filter:blur(26px) saturate(180%);
  border-top:1px solid var(--line);
  z-index:20;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  background:none;border:none;color:var(--muted2);
  font-size:9.5px;font-weight:700;letter-spacing:.02em;
  padding:5px 2px;border-radius:12px;position:relative;
  transition:color .18s, transform .12s;
}
.tab:active{transform:scale(.92);}
.tab svg{width:23px;height:23px;}
.tab.on{color:#0a0a0b;}
.tab.on svg{stroke-width:2.1;}
.tab .tbadge{
  position:absolute;top:1px;right:calc(50% - 22px);
  min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:#0a0a0b;color:#e7c98a;font-size:9.5px;font-weight:800;
  display:grid;place-items:center;border:2px solid #fff;
}

/* ============================================================
   OVERLAYS
============================================================ */
#stack{position:absolute;inset:0;pointer-events:none;z-index:60;}
#stack .ov{
  position:absolute;inset:0;background:#fff;
  pointer-events:auto;display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform .34s cubic-bezier(.32,.72,0,1);
  will-change:transform;
}
#stack .ov.in{transform:none;}
#stack .ov.sheet{
  transform:translateY(100%);
  border-radius:26px 26px 0 0;
  border-top:1px solid var(--line);
  max-height:90%;
  box-shadow:0 -24px 60px -20px rgba(0,0,0,.25);
}
#stack .ov.sheet.in{transform:none;}
.sheet-handle{
  width:38px;height:4px;border-radius:2px;background:#e4e4e8;
  margin:10px auto 2px;flex:none;
}
.sheet-title{
  font-size:16px;font-weight:750;letter-spacing:-.025em;
  text-align:center;padding:10px 20px 14px;
}

/* ============================================================
   CHAT
============================================================ */
.chat-head{
  flex:none;display:flex;align-items:center;gap:10px;
  padding:calc(var(--sat) + 9px) 12px 9px;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border-bottom:1px solid var(--line);
  z-index:5;
}
.chat-id{flex:1;min-width:0;display:flex;align-items:center;gap:11px;cursor:pointer;}
.chat-id .n{font-size:14.5px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-id .s{font-size:11.5px;color:var(--muted);margin-top:1px;font-weight:500;}
.chat-id .s.online{color:var(--green);}
.chat-id .s .cd{color:var(--gold-d);font-weight:700;}

.msgs{
  flex:1;overflow-y:auto;padding:18px 14px 8px;
  display:flex;flex-direction:column;gap:2px;background:#fff;
  -webkit-overflow-scrolling:touch;
}
.daysep{
  align-self:center;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  color:var(--muted2);background:var(--surface);padding:5px 12px;border-radius:999px;
  margin:12px 0 8px;text-transform:uppercase;
}
.mw{display:flex;flex-direction:column;max-width:82%;}
.mw.me{align-self:flex-end;align-items:flex-end;}
.mw.them{align-self:flex-start;align-items:flex-start;}
.msg{
  padding:10px 14px;border-radius:19px;font-size:14.5px;line-height:1.42;
  word-break:break-word;position:relative;
  animation:mpop .2s cubic-bezier(.2,.9,.3,1.15);
}
@keyframes mpop{from{opacity:0;transform:translateY(5px) scale(.98);}to{opacity:1;transform:none;}}

const $  = (s,r=document)=>r.querySelector(s);

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function userByCode(c){ return USERS.find(u=>u.code===c) || {code:c,alias:'UNKNOWN',role:'real',emoji:'❓',hue:0,skills:[],bio:''}; }
function roleName(r){ return (ROLES[r]||ROLES.real).name; }

function av(u, size='md'){
  const cls = 'av av-'+size;
  if(u.photo) return `<div class="${cls}" style="background-image:url('${u.photo}')"></div>`;
  return `<div class="${cls}" style="--h:${u.hue||220}">${u.emoji||'👤'}</div>`;
}
function badgeHTML(role){
  const map = {
    creator : ['Creator','badge gold'],
    maker   : ['Maker','badge ink'],
    investor: ['Investor','badge bronze'],
    real    : ['Real World','badge grey']
  };
  const [t,c] = map[role] || map.real;
  return `<span class="${c}">${t}</span>`;
}
function codeLine(u){
  return `${esc(u.alias)}<span style="color:#c6a15b">&lt;&gt;</span><span style="color:#a8813c;font-weight:700">${esc(u.code)}</span>`;
}
function nowTime(){ return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false}); }

function toast(title, sub, ico='💬'){
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = `
    <div class="av av-sm" style="--h:38;font-size:18px">${ico}</div>
    <div class="tx"><div class="tt">${esc(title)}</div><div class="ts">${esc(sub)}</div></div>`;
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),280); }, 3000);
}

/* ---------- OVERLAY STACK ---------- */
function pushOv(html, sheet){
  const n = document.createElement('div');
  n.className = 'ov' + (sheet ? ' sheet' : '');
  n.innerHTML = html;
  $('#stack').appendChild(n);
  requestAnimationFrame(()=>requestAnimationFrame(()=>n.classList.add('in')));
  return n;
}
function closeOv(n){
  if(!n) return;
  n.classList.remove('in');
  setTimeout(()=>n.remove(), 360);
}

/* ============================================================
   CODE GENERATION
============================================================ */
function generateCode(roleKey){
  const digits = ROLES[roleKey].digits;
  const taken = new Set(USERS.map(u=>u.code));
  let code;
  do{
    if(roleKey === 'real'){
      code = '100' + String(Math.floor(Math.random()*1000000)).padStart(6,'0');
    } else if(roleKey === 'creator'){
      code = String(Math.floor(1 + Math.random()*999)).padStart(3,'0');
    } else if(roleKey === 'maker'){
      code = String(Math.floor(1000 + Math.random()*9000)).padStart(4,'0');
    } else {
      code = String(Math.floor(1 + Math.random()*99)).padStart(2,'0');
    }
  } while(taken.has(code));
  return code;
}

  const list = USERS.filter(u=>u.code !== state.me.code).filter(u=>matches(u, q, state.discFilter));

  const filters = [['all','All'],['creator','Creators'],['maker','Makers'],['investor','Investors'],['real','Real World']];

  $('#v-discover').innerHTML = `
    <h2 class="big-title">Discover</h2>
    <p class="big-sub">Search by Code ID, Alias, Skill or Category.</p>

    <div class="searchbar">
      <div class="sb-wrap">
        ${I.search}
        <input class="sb-input" id="discInput" placeholder="Code, alias, skill or category" value="${esc(q)}" autocomplete="off">
      </div>
    </div>

    <div class="filter-chips">
      ${filters.map(([k,l])=>`<button class="chip ${state.discFilter===k?'on':''}" data-act="disc-filter" data-filter="${k}">${l}</button>`).join('')}
    </div>

    <div class="sec"><h3>${q ? `Results · ${list.length}` : 'On the network'}</h3></div>

    ${list.length === 0 ? `
      <div class="empty">
        <div class="ico">🔎</div>
        <p>No Code ID, Alias or Skill matches<br>"${esc(q)}"</p>
      </div>` :
      list.map(u=>`
        <div class="dcard">
          <div class="dcard-top" data-act="open-profile" data-code="${u.code}">
            ${av(u,'md')}
            <div style="flex:1;min-width:0">
              <div class="nm">${esc(u.alias)}</div>
              <div class="cd">&lt;&gt; ${esc(u.code)}</div>
            </div>
            ${badgeHTML(u.role)}
          </div>
          <div class="bio">${esc(u.bio)}</div>
          <div class="skills">${(u.skills||[]).map(s=>`<span class="skill">${esc(s)}</span>`).join('')}</div>
          <div class="dcard-actions">
            <button class="btn primary" data-act="open-chat" data-code="${u.code}">Chat</button>
            <button class="btn iconic soft" data-act="call" data-code="${u.code}" data-mode="voice">${I.phone}</button>
            <button class="btn iconic soft" data-act="call" data-code="${u.code}" data-mode="video">${I.video}</button>
            <button class="btn iconic soft" data-act="invite" data-code="${u.code}">${I.groupAdd}</button>
          </div>
        </div>`).join('')}
    <div style="height:20px"></div>
  `;

  const inp = $('#discInput');
  inp.addEventListener('input', e=>{
    state.discQ = e.target.value;
    const pos = e.target.selectionStart;
    renderDiscover();
    const ni = $('#discInput');
    ni.focus();
    ni.setSelectionRange(pos,pos);
  });
}

============================================================ */
function renderChats(){
  const pinned = store.dms.filter(d=>d.pinned);
  const rest   = store.dms.filter(d=>!d.pinned);

  const chatRow = d => {
    const u = userByCode(d.code);
    const last = d.messages[d.messages.length-1];
    const preview = last.kind === 'file' ? '📎 Attachment'
                  : last.kind === 'voice' ? '🎤 Voice note'
                  : esc(last.text);
    return `
      <div class="row" data-act="open-chat" data-code="${d.code}">
        ${av(u,'md')}
        <div class="row-body">
          <div class="row-top">
            <div class="row-name">${esc(u.alias)}</div>
            <div class="row-code">&lt;&gt;${esc(u.code)}</div>
            <div class="row-time">${esc(last.time)}</div>
          </div>
          <div class="row-prev">${last.from==='me'?'<span style="color:#b4b4ba">You: </span>':''}${preview}</div>
        </div>
        ${d.unread>0?`<div class="unread">${d.unread}</div>`:''}
      </div>`;
  };

  $('#v-chats').innerHTML = `
    <h2 class="big-title">Chats</h2>
    <p class="big-sub">${store.dms.length} conversations on your code.</p>
    <div style="height:6px"></div>

    ${pinned.length?`
      <div class="sec" style="padding-top:14px"><h3 style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#b4b4ba">Pinned</h3></div>
      ${pinned.map(chatRow).join('')}
    `:''}

    <div class="sec" style="padding-top:18px"><h3 style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#b4b4ba">All messages</h3></div>
    ${rest.map(chatRow).join('')}

    <div style="padding:22px 18px 0">
      <button class="btn soft block" data-act="tab" data-tab="discover">${I.search} Start a new conversation</button>
    </div>
    <div style="height:20px"></div>
  `;
}

/* ============================================================
   CHAT OVERLAY
============================================================ */
function getConvo(id){
  const [t,k] = id.split(':');
  if(t==='dm')  return store.dms.find(d=>d.code===k);
  if(t==='grp') return store.groups.find(g=>g.id===k);
  return null;
}

function renderMessages(convo, kind){
  let html = '', lastDay = null;
  convo.messages.forEach(m=>{
    const mine = m.from === 'me';
    const day = /^\d{2}:\d{2}$/.test(m.time) ? 'Today' : m.time;
    if(day !== lastDay){ html += `<div class="daysep">${esc(day)}</div>`; lastDay = day; }

    const sender = (!mine && kind==='grp')
      ? `<div class="msg-sender">${esc(userByCode(m.from).alias)}&lt;&gt;${esc(m.from)}</div>` : '';

    if(m.kind === 'file'){
      html += `<div class="mw ${mine?'me':'them'}">${sender}
        <div class="attach-msg ${mine?'me':'them'}">
          <div class="ico">📎</div>
          <div><div class="nm">${esc(m.fileName||'Attachment')}</div><div class="mt">${esc(m.fileMeta||'File')}</div></div>
          <div style="font-size:9.5px;opacity:.6;align-self:flex-end">${esc(m.time)}</div>
        </div></div>`;
      return;
    }
    if(m.kind === 'voice'){
      const bars = Array.from({length:14},()=>`<i style="height:${6+Math.random()*13}px"></i>`).join('');
      html += `<div class="mw ${mine?'me':'them'}">${sender}
        <div class="voice-msg ${mine?'me':'them'}">
          <span style="font-size:15px">▶</span>
          <span class="wave">${bars}</span>
          <span style="font-size:11px;opacity:.7;font-weight:700">${esc(m.dur||'0:08')}</span>
        </div></div>`;
      return;
    }
    html += `<div class="mw ${mine?'me':'them'}">${sender}
      <div class="msg ${mine?'me':'them'}">${esc(m.text)}<span class="t">${esc(m.time)}</span></div>
    </div>`;
  });
  return html;
}

function openChat(id){
  const convo = getConvo(id);
  if(!convo) return;
  const [type, key] = id.split(':');
  convo.unread = 0;

  let head, kind;
  if(type === 'dm'){
    const u = userByCode(key);
    kind = 'dm';
    head = `
      <div class="chat-id" data-act="open-profile" data-code="${u.code}">
        ${av(u,'sm')}
        <div style="min-width:0">
          <div class="n">${esc(u.alias)}</div>
          <div class="s ${convo.online?'online':''}">&lt;&gt; ${esc(u.code)} · ${convo.online?'Online':'Last seen recently'}</div>
        </div>
      </div>
      <button class="icon-btn muted" data-act="call" data-code="${u.code}" data-mode="voice">${I.phone}</button>
      <button class="icon-btn muted" data-act="call" data-code="${u.code}" data-mode="video">${I.video}</button>`;
  } else {
    const g = store.groups.find(x=>x.id===key);
    kind = 'grp';
    head = `
      <div class="chat-id" data-act="group-info" data-id="${g.id}">
        <div class="av av-sm" style="--h:${g.hue}">${g.emoji}</div>
        <div style="min-width:0">
          <div class="n">${esc(g.name)}</div>
          <div class="s">${g.members.length} members</div>
        </div>
      </div>
      <button class="icon-btn muted" data-act="voice-room" data-id="${g.id}">${I.mic}</button>
      <button class="icon-btn muted" data-act="video-room" data-id="${g.id}">${I.video}</button>`;
  }

  const ov = pushOv(`
    <header class="chat-head">
      <button class="icon-btn" data-act="close-ov">${I.back}</button>
      ${head}
    </header>
    <div class="msgs" id="msgs"></div>
    <div class="emoji-bar" id="emojiBar" hidden>
      ${['😀','😂','🙌','🔥','✅','👀','💡','🚀','🤝','❤️','👏','🧠','📌','⚡'].map(e=>`<button data-act="emoji" data-e="${e}">${e}</button>`).join('')}
    </div>
    <div class="composer">
      <button class="round-btn" data-act="attach">${I.clip}</button>
      <input id="msgInput" placeholder="Message" autocomplete="off">
      <button class="round-btn" data-act="toggle-emoji">${I.smile}</button>
      <button class="round-btn" data-act="voice-note">${I.mic}</button>
      <button class="send-btn" data-act="send" data-id="${id}">${I.send}</button>
    </div>
  `);
  ov.dataset.chatId = id;

  const msgs = $('#msgs', ov);
  msgs.innerHTML = renderMessages(convo, kind);
  requestAnimationFrame(()=>{ msgs.scrollTop = msgs.scrollHeight; });

  const input = $('#msgInput', ov);
  input.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ e.preventDefault(); sendMessage(id); }
  });
  setTimeout(()=>input.focus(), 380);

  renderChats(); renderGroups(); renderTabbar();
  return ov;
}

function sendMessage(id){
  const ov = $$('#stack .ov').find(o=>o.dataset.chatId === id);
  if(!ov) return;
  const input = $('#msgInput', ov);
  const text = input.value.trim();
  if(!text) return;

  const convo = getConvo(id);
  convo.messages.push({from:'me', text, time:nowTime()});
  input.value = '';

  const [type, key] = id.split(':');
  const kind = type === 'dm' ? 'dm' : 'grp';
  const msgs = $('#msgs', ov);
  msgs.innerHTML = renderMessages(convo, kind);
  msgs.scrollTop = msgs.scrollHeight;

  if(type === 'dm'){
    setTimeout(()=>{
      const open = $$('#stack .ov').find(o=>o.dataset.chatId === id);
      if(open){
        const m = $('#msgs', open);
        m.insertAdjacentHTML('beforeend', `<div class="mw them"><div class="msg them typing"><i></i><i></i><i></i></div></div>`);
        m.scrollTop = m.scrollHeight;
      }
    }, 800);

    setTimeout(()=>{
      const u = userByCode(key);
      const replies = [
        'Understood. I’ll confirm shortly.',
        'Noted — adding it to the list.',
        'That works for me.',
        'Sending the file across now.',
        'Agreed. Let’s keep the window tight.',
        'Received. Code verified on my side.'
      ];
      const reply = replies[Math.floor(Math.random()*replies.length)];
      convo.messages.push({from:key, text:reply, time:nowTime()});

      const open = $$('#stack .ov').find(o=>o.dataset.chatId === id);
      if(open){
        const m = $('#msgs', open);
        m.innerHTML = renderMessages(convo, kind);
        m.scrollTop = m.scrollHeight;
      } else {
        convo.unread = (convo.unread||0) + 1;
        toast(u.alias + '<>' + u.code, reply, u.emoji);
      }
      renderChats(); renderTabbar();
    }, 2300);
  } else {
    renderGroups();
  }
}

============================================================ */
let callTimer = null;

function endCallUI(node){
  if(callTimer){ clearInterval(callTimer); callTimer = null; }
  node.style.transition = 'opacity .24s, transform .24s';
  node.style.opacity = '0';
  node.style.transform = 'scale(.97)';
  setTimeout(()=>node.remove(), 250);
}

function startVoiceCall(code){
  const u = userByCode(code);
  const node = document.createElement('div');
  node.id = 'callVoice';
  node.innerHTML = `
    <div class="call-av" ${u.photo?`style="background-image:url('${u.photo}')"`:''}>${u.photo?'':(u.emoji||'👤')}</div>
    <div class="call-nm">${esc(u.alias)}</div>
    <div class="call-cd">&lt;&gt; ${esc(u.code)}</div>
    <div class="call-st" id="vStatus">Calling…</div>
    <div class="call-ctrl">
      <button class="cbtn" data-c="mute">${I.mic}</button>
      <button class="cbtn end" data-c="end">${I.phone}</button>
      <button class="cbtn" data-c="spk">${I.vol}</button>
    </div>`;
  $('#app').appendChild(node);

  let secs = 0, connected = false;
  setTimeout(()=>{
    connected = true;
    const st = $('#vStatus', node);
    if(st) st.textContent = '00:00';
    callTimer = setInterval(()=>{
      secs++;
      const s = $('#vStatus', node);
      if(s) s.textContent = `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;
    }, 1000);
  }, 2000);

  node.addEventListener('click', e=>{
    const b = e.target.closest('[data-c]');
    if(!b) return;
    const c = b.dataset.c;
    if(c === 'end'){
      const dur = connected ? `${Math.floor(secs/60)}m ${secs%60}s` : '';
      if(connected){
        store.calls.unshift({code:u.code, mode:'voice', dir:'out', time:nowTime(), dur});
      }
      endCallUI(node);
      return;
    }
    b.classList.toggle('on');
    b.innerHTML = b.classList.contains('on')
      ? (c === 'mute' ? I.micOff : I.vol)
      : (c === 'mute' ? I.mic   : I.vol);
  });
}

function startVideoCall(code){

    <div class="video-top">

      <button class="cbtn" data-c="spk">${I.vol}</button>
    </div>`;
  $('#app').appendChild(node);

  let secs = 0, connected = false;
  setTimeout(()=>{
    connected = true;
    const st = $('#vidStatus', node);
    if(st) st.textContent = '00:00';
    callTimer = setInterval(()=>{
      secs++;
      const s = $('#vidStatus', node);
      if(s) s.textContent = `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;
    }, 1000);
  }, 2200);

  node.addEventListener('click', e=>{
    const b = e.target.closest('[data-c]');
    if(!b) return;
    const c = b.dataset.c;
    if(c === 'end'){
      const dur = connected ? `${Math.floor(secs/60)}m ${secs%60}s` : '';
      if(connected){
        store.calls.unshift({code:u.code, mode:'video', dir:'out', time:nowTime(), dur});
      }
      endCallUI(node);
      return;
    }
    b.classList.toggle('on');
    const on = b.classList.contains('on');
    if(c === 'mic') b.innerHTML = on ? I.micOff : I.mic;
    if(c === 'cam'){
      b.innerHTML = on ? I.camOff : I.cam;

      if(remote) remote.style.opacity = on ? '.25' : '1';
    }
    if(c === 'spk') b.innerHTML = I.vol;
  });
}

  `, true);

  const renderDraft = ()=>{
    const u0 = state.me;
    $('#gChips', ov).innerHTML = draftGroup.members.length
      ? draftGroup.members.map(c=>{
          const u = userByCode(c);
          return `<div style="display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:14px;background:#fafafa;border:1px solid var(--line);margin-bottom:8px">
            ${av(u,'sm')}

            <button class="icon-btn" data-act="g-rm" data-code="${c}" style="width:30px;height:30px;color:#8a8a8e">${I.x}</button>
          </div>`;
        }).join('')
      : `<div style="font-size:12.5px;color:#b4b4ba">No members added yet.</div>`;

    const pool = USERS.filter(u=>u.code !== u0.code && !draftGroup.members.includes(u.code)).slice(0,5);
    $('#gSuggest', ov).innerHTML = pool.map(u=>`
      <div class="row" style="padding:9px 0" data-act="g-quick" data-code="${u.code}">
        ${av(u,'sm')}
        <div class="row-body">
          <div style="font-size:13.5px;font-weight:650">${esc(u.alias)} <span style="color:#a8813c">&lt;&gt;${esc(u.code)}</span></div>
          <div style="font-size:11px;color:#8a8a8e;margin-top:2px">${roleName(u.role)}</div>
        </div>
        <div style="color:#c6a15b;font-size:20px;font-weight:300">+</div>
      </div>`).join('');
  };

  renderDraft();
  ov._render = renderDraft;

  const name = $('#gName', ov);
  name.addEventListener('input', e=>{ draftGroup.name = e.target.value; });

  const codeInp = $('#gCode', ov);
  const add = ()=>{
    const v = codeInp.value.trim().replace(/[^0-9]/g,'');
    if(!v) return;
    const u = USERS.find(x=>x.code === v);
    if(!u){ toast('Code not found', `No node with Code ID ${v}`, '⚠️'); return; }
    if(u.code === state.me.code){ toast('That’s you', 'You’re already in the group', '🙂'); return; }
    if(draftGroup.members.includes(u.code)){ toast('Already added', `${u.alias}<>${u.code}`, 'ℹ️'); return; }
    draftGroup.members.push(u.code);
    codeInp.value = '';
    renderDraft();
  };
  codeInp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); }});
  ov._add = add;
}

/* ============================================================
   EVENT DELEGATION
============================================================ */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;

  switch(act){

    /* ---------- FLOW ---------- */
    case 'go-identity':
      renderIdentity();
      show('s-identity');
      break;

    case 'go-splash':
      show('s-splash');
      break;

    case 'pick-role':
      state.draftRole = el.dataset.role;
      state.draft = { alias:'', photo:null, bio:'', skills:[] };
      ensurePhotoInput();
      renderCreate();
      show('s-create');
      break;

    case 'pick-photo': {
      ensurePhotoInput();
      const f = $('#photoInput');
      f.value = '';
      f.click();
      break;
    }

    case 'edit-photo': {
      ensurePhotoInput();
      const f = $('#photoInput');
      f.value = '';
      f.click();
      break;
    }

    case 'add-skill': {
      const s = el.dataset.skill;
      if(!state.draft.skills.includes(s) && state.draft.skills.length < 6){
        state.draft.skills.push(s);
        renderCreate();
      }
      break;
    }

    case 'rm-skill':
      state.draft.skills = state.draft.skills.filter(s=>s !== el.dataset.skill);
      renderCreate();
      break;

    case 'create-code': {
      const aliasInput = $('#fAlias');
      const bioInput   = $('#fBio');
      if(aliasInput) state.draft.alias = aliasInput.value.trim().toUpperCase();
      if(bioInput)   state.draft.bio   = bioInput.value.trim();

      if(!state.draft.alias){
        toast('Alias required', 'Enter an alias name to continue', '⚠️');
        if(aliasInput) aliasInput.focus();
        return;
      }
      const code = generateCode(state.draftRole);
      const role = state.draftRole;

      const me = {
        code,
        alias: state.draft.alias,
        role,
        emoji: ROLES[role].glyph,
        hue: 38,
        photo: state.draft.photo,
        bio: state.draft.bio || `${ROLES[role].name} member on the 1008 network.`,
        skills: state.draft.skills.length ? state.draft.skills : ['New Node']
      };
      state.me = me;
      renderSuccess(me);
      show('s-success');
      break;
    }

    case 'enter-app':
      show('s-main');
      renderAll();
      setTab('home');
      setTimeout(()=>toast('Welcome to 1008', `${state.me.alias}<>${state.me.code} is live`, '✅'), 500);
      break;

    /* ---------- NAV ---------- */
    case 'tab':
      closeAllOv();
      setTab(el.dataset.tab);
      break;

    case 'close-ov': {
      const ov = el.closest('.ov');
      closeOv(ov);
      break;
    }

    /* ---------- CHATS ---------- */
    case 'open-chat': {
      const code = el.dataset.code;
      if(code === state.me.code) return;
      if(!store.dms.find(d=>d.code === code)){
        store.dms.unshift({
          code, pinned:false, unread:0, online:true,
          messages:[{from:code, text:`Connected. This is ${userByCode(code).alias}<>${code}.`, time:nowTime()}]
        });
      }
      closeAllOv();
      setTimeout(()=>openChat('dm:'+code), 60);
      break;
    }

    case 'open-group': {
      closeAllOv();
      setTimeout(()=>openChat('grp:'+el.dataset.id), 60);
      break;
    }

    case 'send':
      sendMessage(el.dataset.id);
      break;

    case 'toggle-emoji': {
      const bar = $('#emojiBar');
      if(bar) bar.hidden = !bar.hidden;
      break;
    }

    case 'emoji': {
      const input = $('#msgInput');
      if(input){ input.value += el.dataset.e; input.focus(); }
      break;
    }

    case 'voice-note': {
      const ov = $$('#stack .ov').find(o=>o.dataset.chatId);
      if(!ov) return;
      const id = ov.dataset.chatId;
      const convo = getConvo(id);
      const dur = `0:${String(5 + Math.floor(Math.random()*14)).padStart(2,'0')}`;
      convo.messages.push({from:'me', kind:'voice', dur, time:nowTime()});
      const [t] = id.split(':');
      const m = $('#msgs', ov);
      m.innerHTML = renderMessages(convo, t === 'dm' ? 'dm' : 'grp');
      m.scrollTop = m.scrollHeight;
      renderChats();
      break;
    }

    case 'attach': {
      pushOv(`
        <div class="sheet-handle"></div>
        <div class="sheet-title">Send attachment</div>
        <div style="padding:0 18px calc(var(--sab) + 22px)">
          ${[['🖼️','Photo','JPG, PNG'],['📄','Document','PDF, DOCX'],['📍','Location','Share a place'],['🎵','Audio','MP3, WAV']]
            .map(([i,t,s])=>`
            <div class="row" style="border-radius:16px;border:1px solid var(--line);margin-bottom:9px;background:#fff"
                 data-act="send-attach" data-name="${t}" data-meta="${s}">
              <div class="av av-md" style="--h:38;font-size:20px">${i}</div>
              <div class="row-body">
                <div class="row-name">${t}</div>
                <div class="row-prev">${s}</div>
              </div>
            </div>`).join('')}
          <button class="btn ghost block" data-act="close-ov" style="margin-top:8px">Cancel</button>
        </div>
      `, true);
      break;
    }

    case 'send-attach': {
      const sheet = el.closest('.ov');
      const chatOv = $$('#stack .ov').find(o=>o.dataset.chatId);
      if(!chatOv) return;
      const id = chatOv.dataset.chatId;
      const [t] = id.split(':');
      const convo = getConvo(id);
      convo.messages.push({
        from:'me', kind:'file',
        fileName: el.dataset.name, fileMeta: el.dataset.meta,
        time: nowTime()
      });
      const m = $('#msgs', chatOv);
      m.innerHTML = renderMessages(convo, t === 'dm' ? 'dm' : 'grp');
      m.scrollTop = m.scrollHeight;
      closeOv(sheet);
      renderChats();
      break;
    }

    /* ---------- DISCOVER ---------- */
    case 'disc-filter':
      state.discFilter = el.dataset.filter;
      renderDiscover();
      break;

    case 'open-profile':
      openProfile(el.dataset.code);
      break;

    case 'portfolio':
      toast('Portfolio', `Opening ${userByCode(el.dataset.code).alias}’s full portfolio`, '🎨');
      break;

    case 'book-meeting':
      toast('Meeting requested', `A request was sent to ${userByCode(el.dataset.code).alias}`, '📅');
      break;

    case 'join-group':
      toast('Group joined', `You joined ${userByCode(el.dataset.code).alias}’s network group`, '👥');
      break;

    /* ---------- CALLS ---------- */
    case 'call': {
      const code = el.dataset.code;
      const mode = el.dataset.mode;
      closeAllOv();
      setTimeout(()=>{
        if(mode === 'video') startVideoCall(code);
        else startVoiceCall(code);
      }, 120);
      break;
    }

    /* ---------- GROUPS ---------- */
    case 'new-group':
      closeAllOv();
      setTimeout(openNewGroup, 60);
      break;

    case 'g-add': {
      const ov = el.closest('.ov');
      if(ov && ov._add) ov._add();
      break;
    }

    case 'g-quick': {
      const code = el.dataset.code;
      if(!draftGroup.members.includes(code)) draftGroup.members.push(code);
      const ov = el.closest('.ov');
      if(ov && ov._render) ov._render();
      break;
    }

    case 'g-rm': {
      draftGroup.members = draftGroup.members.filter(c=>c !== el.dataset.code);
      const ov = el.closest('.ov');
      if(ov && ov._render) ov._render();
      break;
    }

    case 'g-create': {
      const ov = el.closest('.ov');
      const nameInput = $('#gName', ov);
      const name = (nameInput && nameInput.value.trim()) || draftGroup.name.trim() || 'NEW GROUP';
      if(draftGroup.members.length === 0){
        toast('Add members', 'Invite at least one Code ID', '⚠️');
        return;
      }
      const g = {
        id: 'g' + Date.now(),
        name: name.toUpperCase(),
        emoji: '🗂️',
        hue: Math.floor(Math.random()*360),
        unread: 0,
        members: [state.me.code, ...draftGroup.members],
        messages: [{from:'me', text:`Group created · ${draftGroup.members.length} member(s) invited.`, time:nowTime()}]
      };
      store.groups.unshift(g);
      closeOv(ov);
      renderGroups(); renderProfile();
      toast('Group created', `${g.name} · ${g.members.length} members`, '👥');
      setTimeout(()=>openChat('grp:'+g.id), 320);
      break;
    }

    case 'group-info': {
      const g = store.groups.find(x=>x.id === el.dataset.id);
      if(!g) break;
      pushOv(`
        <header class="nav">
          <button class="icon-btn" data-act="close-ov">${I.back}</button>
          <div class="nav-title">Group info</div>
        </header>
        <div class="scroll" style="flex:1">
          <div style="padding:26px 20px 20px;text-align:center;border-bottom:1px solid var(--line)">
            <div style="display:flex;justify-content:center">
              <div class="av av-xl" style="--h:${g.hue}">${g.emoji}</div>
            </div>
            <div style="font-size:22px;font-weight:800;letter-spacing:-.035em;margin-top:16px">${esc(g.name)}</div>
            <div style="font-size:12.5px;color:#8a8a8e;margin-top:6px">${g.members.length} members</div>
            <div style="display:flex;gap:8px;margin-top:18px">
              <button class="btn soft" style="flex:1" data-act="voice-room" data-id="${g.id}">${I.mic} Voice</button>
              <button class="btn soft" style="flex:1" data-act="video-room" data-id="${g.id}">${I.video} Video</button>
            </div>
          </div>

          <div class="sec"><h3>Members</h3></div>
          ${g.members.map(c=>{
            const u = userByCode(c);
            return `<div class="row" data-act="open-profile" data-code="${u.code}">
              ${av(u,'sm')}
              <div class="row-body">
                <div class="row-name">${esc(u.alias)} <span class="row-code">&lt;&gt;${esc(u.code)}</span></div>
                <div class="row-prev">${roleName(u.role)}${c === state.me.code ? ' · You' : ''}</div>
              </div>
            </div>`;
          }).join('')}

          <div style="padding:20px 18px 0">
            <button class="btn primary block" data-act="new-group">${I.plus} Invite by Code</button>
          </div>
          <div style="height:30px"></div>
        </div>
      `);
      break;
    }

    case 'voice-room':
      openRoom(el.dataset.id, 'voice');
      break;

    case 'video-room':
      openRoom(el.dataset.id, 'video');
      break;

    case 'invite':
      closeAllOv();
      setTimeout(()=>openInvite(el.dataset.code), 60);
      break;

    case 'do-invite': {
      const g = store.groups.find(x=>x.id === el.dataset.group);
      const u = userByCode(el.dataset.code);
      if(g && !g.members.includes(u.code)){
        g.members.push(u.code);
        g.messages.push({from:'me', text:`${u.alias}<>${u.code} was added to the group.`, time:nowTime()});
        renderGroups();
        toast('Member added', `${u.alias}<>${u.code} → ${g.name}`, '✅');
      }
      closeOv(el.closest('.ov'));
      break;
    }

    /* ---------- PROFILE ---------- */
    case 'notifs':
      openNotifs();
      break;

    case 'edit-profile':
      ensurePhotoInput();
      openEditProfile();
      break;

    case 'save-profile': {
      const ov = el.closest('.ov');
      const a = $('#eAlias', ov).value.trim().toUpperCase();
      const b = $('#eBio', ov).value.trim();
      if(a) state.me.alias = a;
      state.me.bio = b;
      renderProfile(); renderHome(); renderTopbar();
      closeOv(ov);
      toast('Profile updated', `${state.me.alias}<>${state.me.code}`, '✅');
      break;
    }

    case 'share-code':
      toast('Code ID copied', `${state.me.alias}<>${state.me.code}`, '🔗');
      break;

    case 'signout':
      pushOv(`
        <div class="sheet-handle"></div>
        <div class="sheet-title">Sign out?</div>
        <div style="padding:0 22px 10px;text-align:center;font-size:13px;color:#8a8a8e;line-height:1.6">
          Your Code ID <b style="color:#a8813c">${esc(state.me.alias)}&lt;&gt;${esc(state.me.code)}</b> will remain reserved on the network.
        </div>
        <div style="padding:16px 18px calc(var(--sab) + 18px)">
          <button class="btn block" style="background:#ff3b30;color:#fff" data-act="do-signout">Sign out</button>
          <button class="btn ghost block" data-act="close-ov" style="margin-top:9px">Cancel</button>
        </div>
      `, true);
      break;

    case 'do-signout':
      closeAllOv();
      setTimeout(()=>{
        state.me = null;
        state.tab = 'home';
        state.draft = { alias:'', photo:null, bio:'', skills:[] };
        show('s-splash');
      }, 300);
      break;

    /* ---------- MISC ---------- */
    case 'new-chat':
      setTab('discover');
      setTimeout(()=>{ const i = $('#discInput'); if(i) i.focus(); }, 140);
      break;

    case 'soon':
      toast('Coming soon', 'This module is not part of the prototype', '🔒');
      break;
  }
});

/* ============================================================
   BOOT
============================================================ */
ensurePhotoInput();
renderIdentity();
show('s-splash');
</script>
</body>
</html>
