<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes">
  <title>Vakeel Connect — Legal Marketplace</title>
  <style>
    /* ---------- CSS variables ---------- */
    :root {
      --navy: #1f3a5f;
      --gold: #b8860b;
      --bg: #fdfbf7;
      --surface: #ffffff;
      --text: #1e1e1e;
      --text-muted: #5e5e5e;
      --border: #d9d0c0;
      --card-shadow: 0 4px 12px rgba(0,0,0,0.04);
      --focus-ring: 0 0 0 3px rgba(184,134,11,0.4);
      --danger: #b33a3a;
      --success: #2e6b4a;
      --radius: 14px;
      --radius-sm: 8px;
      --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --navy: #9bb7d4;
        --gold: #d4a017;
        --bg: #121212;
        --surface: #1e1e1e;
        --text: #ececec;
        --text-muted: #b0b0b0;
        --border: #333333;
        --card-shadow: 0 4px 12px rgba(0,0,0,0.3);
        --focus-ring: 0 0 0 3px rgba(212,160,23,0.5);
        --danger: #cf6679;
        --success: #7bc9a2;
      }
    }

    /* ---------- Reset & base ---------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.5;
      background: var(--bg);
      color: var(--text);
      padding: 0 16px 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* sticky header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      margin: 0 -16px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    .logo {
      font-weight: 700;
      font-size: 1.3rem;
      color: var(--navy);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .logo span {
      color: var(--gold);
      font-size: 1.5rem;
      line-height: 1;
    }

    .mode-toggle {
      display: flex;
      background: var(--bg);
      border-radius: 40px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .mode-toggle button {
      background: transparent;
      border: none;
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      min-height: 40px;
      transition: background 0.15s, color 0.15s;
    }
    .mode-toggle button.active {
      background: var(--navy);
      color: #fff;
    }
    .mode-toggle button:focus-visible {
      outline: var(--focus-ring);
      outline-offset: 2px;
    }

    /* Demo login dropdown */
    .demo-login {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      background: var(--bg);
      padding: 4px 10px 4px 14px;
      border-radius: 40px;
      border: 1px solid var(--border);
    }
    .demo-login select {
      background: transparent;
      border: none;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
      padding: 6px 0;
      cursor: pointer;
      min-height: 36px;
    }
    .demo-login select:focus-visible {
      outline: var(--focus-ring);
      border-radius: 4px;
    }

    /* ---------- layout ---------- */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    h1, h2, h3 {
      font-weight: 600;
      line-height: 1.25;
    }
    h1 { font-size: 1.8rem; margin-bottom: 8px; }
    h2 { font-size: 1.4rem; margin-bottom: 12px; }
    h3 { font-size: 1.1rem; margin-bottom: 8px; }

    /* ---------- cards ---------- */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 18px;
      box-shadow: var(--card-shadow);
      transition: box-shadow 0.2s;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 900px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* lawyer card */
    .lawyer-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--navy);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 20px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .badge.verified {
      background: #e6f0e9;
      border-color: #b3d1bc;
      color: var(--success);
    }
    .badge.pending {
      background: #fff3e0;
      border-color: #e6c9a8;
      color: #9e6b1f;
    }
    @media (prefers-color-scheme: dark) {
      .badge.verified { background: #1e3a2b; border-color: #2d6b4a; color: #b3e6c9; }
      .badge.pending { background: #3a2e1a; border-color: #7a5c2e; color: #e6c88a; }
    }

    .tag {
      display: inline-block;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-right: 4px;
      margin-bottom: 4px;
    }

    .stars {
      color: var(--gold);
      font-weight: 600;
      letter-spacing: 1px;
    }

    .fee {
      font-weight: 700;
      color: var(--navy);
      font-size: 1.1rem;
    }

    button, .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 40px;
      padding: 8px 18px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.9rem;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      text-decoration: none;
      color: inherit;
      background: transparent;
    }
    button:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }
    .btn-primary:hover { background: #152c4a; }
    @media (prefers-color-scheme: dark) {
      .btn-primary { background: #2c4a6e; border-color: #2c4a6e; color: #f0f0f0; }
      .btn-primary:hover { background: #3a5e87; }
    }

    .btn-gold {
      background: var(--gold);
      color: #fff;
      border-color: var(--gold);
    }
    .btn-gold:hover { background: #9e7209; }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover { background: var(--bg); }

    .btn-danger {
      background: transparent;
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 4px 12px;
      font-size: 0.75rem;
      min-height: 32px;
    }
    .btn-danger:hover { background: var(--danger); color: #fff; }

    button:focus-visible, .btn:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: var(--focus-ring);
      outline-offset: 2px;
    }

    input, textarea, select {
      font-family: inherit;
      font-size: 0.95rem;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      width: 100%;
      min-height: 44px;
    }
    textarea { min-height: 80px; resize: vertical; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-weight: 500; font-size: 0.85rem; margin-bottom: 4px; color: var(--text-muted); }

    /* ---------- profile layout ---------- */
    .profile-layout {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    @media (min-width: 800px) {
      .profile-layout {
        flex-direction: row;
        align-items: flex-start;
      }
      .profile-main { flex: 2; }
      .profile-booking { flex: 1; min-width: 280px; }
    }

    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .tabs button {
      background: transparent;
      border: none;
      padding: 10px 14px;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      border-radius: 0;
      min-height: 40px;
    }
    .tabs button.active {
      color: var(--navy);
      border-bottom-color: var(--gold);
    }

    /* empty state */
    .empty {
      color: var(--text-muted);
      font-style: italic;
      padding: 16px 0;
      text-align: center;
      background: var(--bg);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
    }

    /* booking slots */
    .day-picker, .slot-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .day-btn, .slot-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 8px 14px;
      font-size: 0.8rem;
      font-weight: 500;
      min-height: 40px;
      cursor: pointer;
      color: var(--text);
    }
    .day-btn.selected, .slot-btn.selected {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }
    .slot-btn:disabled {
      opacity: 0.5;
      text-decoration: line-through;
      cursor: not-allowed;
      background: var(--bg);
      color: var(--text-muted);
      border-color: var(--border);
    }

    /* ---------- dashboard ---------- */
    .dashboard-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    .dashboard-tabs button {
      background: transparent;
      border: none;
      padding: 10px 12px;
      font-weight: 600;
      font-size: 0.8rem;
      white-space: nowrap;
      color: var(--text-muted);
      border-bottom: 3px solid transparent;
      border-radius: 0;
      min-height: 40px;
    }
    .dashboard-tabs button.active {
      color: var(--navy);
      border-bottom-color: var(--gold);
    }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .list-item:last-child { border-bottom: none; }

    .warning-note {
      background: #fff9e6;
      border-left: 4px solid var(--gold);
      padding: 10px 14px;
      font-size: 0.8rem;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      margin-bottom: 16px;
      color: #6b4e1a;
    }
    @media (prefers-color-scheme: dark) {
      .warning-note { background: #2e2a1a; color: #e6d5a8; border-left-color: var(--gold); }
    }

    .disclaimer {
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 12px;
      line-height: 1.4;
    }

    /* confirmation */
    .confirmation-box {
      text-align: center;
      padding: 30px 16px;
    }
    .zoom-link {
      word-break: break-all;
      font-size: 0.9rem;
      background: var(--bg);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      display: inline-block;
      margin: 8px 0;
    }

    /* utility */
    .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .gap-8 { gap: 8px; }
    .mt-8 { margin-top: 8px; }
    .mt-16 { margin-top: 16px; }
    .mb-8 { margin-bottom: 8px; }
    .text-muted { color: var(--text-muted); font-size: 0.85rem; }
    .hidden { display: none !important; }
    .cursor-pointer { cursor: pointer; }

    /* focus visible for interactive elements */
    .day-btn:focus-visible, .slot-btn:focus-visible, .tabs button:focus-visible, .dashboard-tabs button:focus-visible {
      outline: var(--focus-ring);
      outline-offset: 2px;
    }

    /* responsive fixes */
    @media (max-width: 480px) {
      h1 { font-size: 1.5rem; }
      header { padding: 10px 16px; }
      .logo { font-size: 1.1rem; }
      .mode-toggle button { padding: 6px 12px; font-size: 0.75rem; }
      .demo-login { font-size: 0.75rem; padding: 2px 8px 2px 10px; }
      .demo-login select { font-size: 0.75rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo"><span>⚖️</span> Vakeel Connect</div>
    <div class="mode-toggle" role="tablist" aria-label="Mode">
      <button id="modeClient" class="active" role="tab" aria-selected="true">I need a lawyer</button>
      <button id="modeLawyer" role="tab" aria-selected="false">I'm a lawyer</button>
    </div>
    <div id="lawyerLoginWrap" class="demo-login hidden">
      <label for="lawyerSelect" class="text-muted">Demo login:</label>
      <select id="lawyerSelect"></select>
    </div>
  </header>

  <main class="container" id="app"></main>

  <script>
    (function() {
      'use strict';

      // ---------- ESCAPE HELPER ----------
      function esc(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // ---------- STORAGE ----------
      const STORAGE_KEY = 'vakeelConnect_v1';

      function safeRead() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          return JSON.parse(raw);
        } catch (e) {
          console.warn('Failed to read storage', e);
          return null;
        }
      }

      function safeWrite(data) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
          console.warn('Failed to write storage', e);
        }
      }

      // ---------- SEED DATA ----------
      function getSeedData() {
        const today = new Date();
        function futureDate(daysAhead) {
          const d = new Date(today);
          d.setDate(d.getDate() + daysAhead);
          return d.toISOString().slice(0, 10);
        }

        return {
          lawyers: [
            {
              id: 'law1',
              name: 'Rajesh Khanna',
              city: 'Delhi',
              practiceAreas: ['Criminal', 'Bail', 'White Collar'],
              years: 18,
              barNumber: 'D/1234/2007',
              bio: 'Senior criminal defence counsel with extensive trial experience in Delhi High Court and district courts. Specialises in bail matters and white-collar crime.',
              fee: 1500,
              verified: true,
              rating: 4.7,
              reviewCount: 23,
              availability: {
                weekdays: [1,2,3,4,5],
                slots: ['10:00', '11:00', '14:00', '15:00', '16:00']
              },
              cases: [
                { id: 'c1', title: 'State v. Mehta', year: 2022, description: 'Represented accused in a high-profile economic offence; secured bail after 3 months.', source: 'https://example.com/case1' },
                { id: 'c2', title: 'Delhi HC bail application', year: 2021, description: 'Successfully argued for anticipatory bail in a cyber fraud case.', source: '' },
              ],
              testimonials: [
                { id: 't1', client: 'A. Sharma', rating: 5, text: 'Very responsive and got me bail quickly.' },
                { id: 't2', client: 'P. Verma', rating: 4, text: 'Clear advice, though fees are on the higher side.' },
              ],
              news: [
                { id: 'n1', headline: 'Appointed as amicus curiae in Delhi HC', date: '2024-03-10' },
                { id: 'n2', headline: 'Published article on bail reform in legal journal', date: '2023-11-05' },
              ],
              bookings: [],
            },
            {
              id: 'law2',
              name: 'Meera Deshpande',
              city: 'Mumbai',
              practiceAreas: ['Corporate', 'IP', 'Contracts'],
              years: 12,
              barNumber: 'M/5678/2013',
              bio: 'Corporate lawyer with a focus on technology and intellectual property. Advises startups on compliance, licensing and funding.',
              fee: 2000,
              verified: true,
              rating: 4.9,
              reviewCount: 31,
              availability: {
                weekdays: [1,3,5],
                slots: ['09:00', '10:30', '13:00', '16:30']
              },
              cases: [
                { id: 'c3', title: 'TechNova IP dispute', year: 2023, description: 'Represented a SaaS company in a trademark opposition; favourable settlement.', source: 'https://example.com/case2' },
              ],
              testimonials: [
                { id: 't3', client: 'R. Iyer', rating: 5, text: 'Meera simplified a complex shareholder agreement.' },
              ],
              news: [
                { id: 'n3', headline: 'Speaker at IP India Conference 2024', date: '2024-01-20' },
              ],
              bookings: [],
            },
            {
              id: 'law3',
              name: 'Ananya Rao',
              city: 'Bengaluru',
              practiceAreas: ['Family', 'Property', 'Mediation'],
              years: 8,
              barNumber: 'B/9012/2017',
              bio: 'Family and property law specialist. Focuses on amicable settlements and mediation.',
              fee: 1000,
              verified: false,
              rating: 4.2,
              reviewCount: 9,
              availability: {
                weekdays: [2,4,6],
                slots: ['10:00', '11:30', '15:00', '17:00']
              },
              cases: [],
              testimonials: [],
              news: [
                { id: 'n4', headline: 'Panelist at Bengaluru mediation workshop', date: '2024-02-15' },
              ],
              bookings: [],
            },
          ],
          version: 1
        };
      }

      // ---------- STATE ----------
      let state = {
        mode: 'client',
        currentLawyerId: null,
        selectedLawyerId: 'law1',
        profileTab: 'experience',
        dashboardTab: 'profile',
        bookingForm: {
          lawyerId: null,
          selectedDate: null,
          selectedTime: null,
          name: '',
          email: '',
          issue: '',
          error: '',
          success: false,
          zoomLink: '',
          bookingDetails: null,
        },
        searchQuery: '',
        filterArea: '',
      };

      // Load or seed data
      let db = safeRead();
      if (!db || !db.lawyers || !Array.isArray(db.lawyers)) {
        db = getSeedData();
        safeWrite(db);
      }

      // ---------- RENDER HELPERS ----------
      const app = document.getElementById('app');
      const modeClientBtn = document.getElementById('modeClient');
      const modeLawyerBtn = document.getElementById('modeLawyer');
      const lawyerLoginWrap = document.getElementById('lawyerLoginWrap');
      const lawyerSelect = document.getElementById('lawyerSelect');

      function populateLawyerSelect() {
        lawyerSelect.innerHTML = '';
        db.lawyers.forEach(l => {
          const opt = document.createElement('option');
          opt.value = l.id;
          opt.textContent = l.name + (l.verified ? ' ✓' : ' (pending)');
          if (l.id === state.selectedLawyerId) opt.selected = true;
          lawyerSelect.appendChild(opt);
        });
      }

      function formatDate(dateStr) {
        try {
          const d = new Date(dateStr + 'T00:00:00');
          return d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
        } catch (e) {
          return dateStr;
        }
      }

      function formatTime12(time24) {
        if (!time24) return '';
        const [h, m] = time24.split(':').map(Number);
        const ampm = h >= 12 ? 'PM' : 'AM';
        const h12 = h % 12 || 12;
        return `${h12}:${String(m).padStart(2,'0')} ${ampm} IST`;
      }

      function getInitials(name) {
        return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
      }

      // ---------- RENDER: CLIENT HOME ----------
      function renderClientHome() {
        const query = state.searchQuery.toLowerCase().trim();
        const filter = state.filterArea;

        let filtered = db.lawyers.slice();
        if (query) {
          filtered = filtered.filter(l =>
            l.name.toLowerCase().includes(query) ||
            l.city.toLowerCase().includes(query) ||
            l.practiceAreas.some(a => a.toLowerCase().includes(query))
          );
        }
        if (filter) {
          filtered = filtered.filter(l => l.practiceAreas.includes(filter));
        }

        const allAreas = [...new Set(db.lawyers.flatMap(l => l.practiceAreas))].sort();

        let html = `
          <div style="text-align:center; margin-bottom:28px;">
            <h1>Find a trusted legal advisor</h1>
            <p class="text-muted" style="max-width:600px; margin:0 auto 20px;">Read their experience, cases, and testimonials. Book a paid one-to-one Zoom consultation. First session always paid.</p>
          </div>

          <div class="card" style="margin-bottom:24px;">
            <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end;">
              <div style="flex:2; min-width:200px;">
                <label for="searchInput" class="text-muted" style="font-size:0.8rem;">Search</label>
                <input id="searchInput" type="text" placeholder="Name, city, or issue..." value="${esc(state.searchQuery)}" autocomplete="off">
              </div>
              <div style="flex:1; min-width:160px;">
                <label for="filterArea" class="text-muted" style="font-size:0.8rem;">Practice area</label>
                <select id="filterArea">
                  <option value="">All areas</option>
                  ${allAreas.map(a => `<option value="${esc(a)}" ${state.filterArea===a?'selected':''}>${esc(a)}</option>`).join('')}
                </select>
              </div>
            </div>
          </div>
        `;

        if (filtered.length === 0) {
          html += `<div class="empty">No lawyers match your search. Try a different term or filter.</div>`;
        } else {
          html += `<div class="grid">`;
          filtered.forEach(l => {
            const avgRating = l.rating ? l.rating.toFixed(1) : '—';
            const badgeClass = l.verified ? 'verified' : 'pending';
            const badgeText = l.verified ? 'Bar Council verified' : 'Verification pending';
            html += `
              <div class="card lawyer-card">
                <div style="display:flex; gap:12px; align-items:center;">
                  <div class="avatar">${esc(getInitials(l.name))}</div>
                  <div>
                    <div style="font-weight:700; font-size:1.05rem;">${esc(l.name)}</div>
                    <div class="text-muted">${esc(l.city)} · ${esc(l.years)} yrs exp</div>
                  </div>
                </div>
                <div><span class="badge ${badgeClass}">${badgeText}</span></div>
                <div>${l.practiceAreas.map(a => `<span class="tag">${esc(a)}</span>`).join('')}</div>
                <div class="flex-between">
                  <span class="stars">★ ${avgRating} <span class="text-muted">(${l.reviewCount})</span></span>
                  <span class="text-muted">${l.cases.length} notable case${l.cases.length!==1?'s':''}</span>

              </div>
            `;
          });
          html += `</div>`;
        }

        html += `
          <div class="disclaimer" style="margin-top:30px;">
            <strong>Important:</strong> A consultation is not a lawyer–client engagement until both parties agree.
            Demo: payment and Zoom are simulated.
          </div>
        `;

        app.innerHTML = html;

        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
          searchInput.addEventListener('input', (e) => {
            state.searchQuery = e.target.value;
            const pos = e.target.selectionStart;
            renderClientHome();
            const newInput = document.getElementById('searchInput');
            if (newInput) {
              newInput.focus();
              newInput.setSelectionRange(pos, pos);
            }
          });
        }

        const filterSelect = document.getElementById('filterArea');
        if (filterSelect) {
          filterSelect.addEventListener('change', (e) => {
            state.filterArea = e.target.value;
            renderClientHome();
          });
        }

        document.querySelectorAll('[data-action="view-profile"]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = e.currentTarget.getAttribute('data-lawyer-id');
            state.currentLawyerId = id;
            state.profileTab = 'experience';
            resetBookingForm(id);
            renderClientProfile();
          });
        });
      }

      // ---------- BOOKING FORM RESET ----------
      function resetBookingForm(lawyerId) {
        state.bookingForm = {
          lawyerId: lawyerId,
          selectedDate: null,
          selectedTime: null,
          name: '',
          email: '',
          issue: '',
          error: '',
          success: false,
          zoomLink: '',
          bookingDetails: null,
        };
      }

      // ---------- RENDER: CLIENT PROFILE ----------
      function renderClientProfile() {
        const lawyer = db.lawyers.find(l => l.id === state.currentLawyerId);
        if (!lawyer) {
          state.currentLawyerId = null;
          renderClientHome();
          return;
        }

        const bf = state.bookingForm;
        const isSuccess = bf.success;

        let html = `<button class="btn-outline" style="margin-bottom:16px;" id="backToHome">← Back to all lawyers</button>`;

        if (isSuccess && bf.bookingDetails) {
          const bd = bf.bookingDetails;
          html += `
            <div class="card confirmation-box">
              <h2 style="color:var(--success);">✅ Booking confirmed</h2>
              <p style="margin:12px 0;">Your consultation with <strong>${esc(lawyer.name)}</strong> is booked.</p>
              <div style="background:var(--bg); border-radius:var(--radius-sm); padding:16px; max-width:400px; margin:0 auto; text-align:left;">
                <div><strong>Date:</strong> ${esc(formatDate(bd.date))}</div>
                <div><strong>Time:</strong> ${esc(formatTime12(bd.time))}</div>
                <div><strong>Amount paid:</strong> ₹${esc(bd.amount)}</div>
                <div style="margin-top:8px;"><strong>Zoom link:</strong><br><span class="zoom-link">${esc(bd.zoomLink)}</span></div>
              </div>
              <p class="text-muted" style="margin-top:12px;">The Zoom link has been emailed to ${esc(bd.email)}.</p>
              <div class="disclaimer" style="margin-top:20px;">
                This is a demo. Payment and Zoom are simulated. A consultation is not a lawyer–client engagement until both parties agree.
              </div>
              <button class="btn-primary" style="margin-top:16px;" id="backToHomeFromConfirm">Back to home</button>
            </div>
          `;
          app.innerHTML = html;
          document.getElementById('backToHomeFromConfirm')?.addEventListener('click', () => {
            state.currentLawyerId = null;
            resetBookingForm(null);
            renderClientHome();
          });
          return;
        }

        const tabs = ['experience', 'cases', 'testimonials', 'news'];
        const tabLabels = { experience: 'Experience', cases: 'High-profile cases', testimonials: 'Testimonials', news: 'News & achievements' };

        html += `
          <div class="profile-layout">
            <div class="profile-main card">
              <div style="display:flex; gap:14px; align-items:center; margin-bottom:16px;">
                <div class="avatar" style="width:64px; height:64px; font-size:1.5rem;">${esc(getInitials(lawyer.name))}</div>
                <div>
                  <h2 style="margin:0;">${esc(lawyer.name)}</h2>
                  <div class="text-muted">${esc(lawyer.city)} · ${esc(lawyer.years)} years experience</div>
                  <div><span class="badge ${lawyer.verified?'verified':'pending'}">${lawyer.verified?'Bar Council verified':'Verification pending'}</span></div>
                </div>
              </div>
              <div class="tabs" role="tablist">
                ${tabs.map(t => `<button class="${state.profileTab===t?'active':''}" data-tab="${t}" role="tab">${tabLabels[t]}</button>`).join('')}
              </div>
              <div id="profileTabContent">
                ${renderProfileTabContent(lawyer, state.profileTab)}
              </div>
            </div>

            <div class="profile-booking card">
              <h3>Book a consultation</h3>
              <div class="flex-between" style="margin-bottom:12px;">
                <span class="fee">₹${esc(lawyer.fee)}</span>
                <span class="text-muted">30 min · First session fee</span>
              </div>

              ${bf.error ? `<div style="color:var(--danger); font-size:0.85rem; margin-bottom:10px;">${esc(bf.error)}</div>` : ''}

              <label class="text-muted" style="font-size:0.8rem;">Select a day</label>
              <div class="day-picker" id="dayPicker"></div>

              <label class="text-muted" style="font-size:0.8rem;">Select a time</label>
              <div class="slot-picker" id="slotPicker"></div>

              <div class="form-group">
                <label for="bookName">Your name</label>
                <input id="bookName" type="text" value="${esc(bf.name)}" placeholder="Full name">
              </div>
              <div class="form-group">
                <label for="bookEmail">Email</label>
                <input id="bookEmail" type="email" value="${esc(bf.email)}" placeholder="you@example.com">
              </div>
              <div class="form-group">
                <label for="bookIssue">Short description of issue</label>
                <textarea id="bookIssue" placeholder="Briefly describe your legal issue...">${esc(bf.issue)}</textarea>
              </div>

              <button class="btn-gold" style="width:100%;" id="payAndConfirm" ${(!bf.selectedDate || !bf.selectedTime) ? 'disabled style="opacity:0.6;"' : ''}>
                Pay ₹${esc(lawyer.fee)} & confirm
              </button>

              <div class="disclaimer" style="margin-top:14px;">
                Demo: payment and Zoom are simulated. A consultation is not a lawyer–client engagement until both parties agree.
                Lawyers should follow Bar Council advertising rules.
              </div>
            </div>
          </div>
        `;

        app.innerHTML = html;

        document.querySelectorAll('.tabs button').forEach(btn => {
          btn.addEventListener('click', (e) => {
            state.profileTab = e.currentTarget.getAttribute('data-tab');
            renderClientProfile();
          });
        });

        document.getElementById('backToHome')?.addEventListener('click', () => {
          state.currentLawyerId = null;
          renderClientHome();
        });

        renderDayPicker(lawyer);
        renderSlotPicker(lawyer);

        document.getElementById('bookName')?.addEventListener('input', (e) => { state.bookingForm.name = e.target.value; });
        document.getElementById('bookEmail')?.addEventListener('input', (e) => { state.bookingForm.email = e.target.value; });
        document.getElementById('bookIssue')?.addEventListener('input', (e) => { state.bookingForm.issue = e.target.value; });

        document.getElementById('payAndConfirm')?.addEventListener('click', () => {
          handleBookingPayment(lawyer);
        });
      }

      function renderProfileTabContent(lawyer, tab) {
        if (tab === 'experience') {
          return `
            <div>
              <p style="margin-bottom:12px;">${esc(lawyer.bio || 'No bio provided.')}</p>
              <div class="flex-between" style="font-size:0.9rem;">
                <span><strong>Years of experience:</strong> ${esc(lawyer.years)}</span>
                <span><strong>Bar enrolment:</strong> ${esc(lawyer.barNumber)}</span>
              </div>
              <div style="margin-top:10px;">
                <strong>Practice areas:</strong> ${lawyer.practiceAreas.map(a => `<span class="tag">${esc(a)}</span>`).join('')}
              </div>
            </div>
          `;
        }
        if (tab === 'cases') {
          if (!lawyer.cases || lawyer.cases.length === 0) {
            return `<div class="empty">None added yet</div>`;
          }
          return lawyer.cases.map(c => `
            <div class="list-item" style="flex-direction:column; align-items:flex-start;">
              <div style="font-weight:600;">${esc(c.title)} <span class="text-muted">(${esc(c.year)})</span></div>
              <div style="font-size:0.9rem; margin:4px 0;">${esc(c.description)}</div>
              ${c.source && (c.source.startsWith('http://') || c.source.startsWith('https://')) ? 
                `<a href="${esc(c.source)}" target="_blank" rel="noopener" class="text-muted" style="font-size:0.8rem;">Public source ↗</a>` : ''}
            </div>
          `).join('');
        }
        if (tab === 'testimonials') {
          if (!lawyer.testimonials || lawyer.testimonials.length === 0) {
            return `<div class="empty">None added yet</div>`;
          }
          return lawyer.testimonials.map(t => `
            <div class="list-item" style="flex-direction:column; align-items:flex-start;">
              <div class="stars">${'★'.repeat(t.rating)}${'☆'.repeat(5-t.rating)} <span class="text-muted" style="font-size:0.8rem;">— ${esc(t.client)}</span></div>
              <div style="font-size:0.9rem; margin-top:4px;">"${esc(t.text)}"</div>
            </div>
          `).join('');
        }
        if (tab === 'news') {
          if (!lawyer.news || lawyer.news.length === 0) {
            return `<div class="empty">None added yet</div>`;
          }
          const sorted = [...lawyer.news].sort((a,b) => (b.date || '').localeCompare(a.date || ''));
          return sorted.map(n => `
            <div class="list-item">
              <div>${esc(n.headline)}</div>
              <div class="text-muted" style="font-size:0.8rem;">${esc(n.date)}</div>
            </div>
          `).join('');
        }
        return '';
      }

      // ---------- DAY PICKER ----------
      function renderDayPicker(lawyer) {
        const container = document.getElementById('dayPicker');
        if (!container) return;
        const weekdays = lawyer.availability?.weekdays || [];
        const today = new Date();
        today.setHours(0,0,0,0);
        let daysHtml = '';
        let count = 0;
        for (let i = 0; i < 30 && count < 10; i++) {
          const d = new Date(today);
          d.setDate(d.getDate() + i);
          const dayOfWeek = d.getDay();
          if (weekdays.includes(dayOfWeek)) {
            const dateStr = d.toISOString().slice(0,10);
            const selected = state.bookingForm.selectedDate === dateStr;
            daysHtml += `<button class="day-btn ${selected?'selected':''}" data-date="${esc(dateStr)}">${esc(d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }))}</button>`;
            count++;
          }
        }
        container.innerHTML = daysHtml || `<div class="text-muted" style="font-size:0.85rem;">No available days</div>`;

        container.querySelectorAll('.day-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            state.bookingForm.selectedDate = e.currentTarget.getAttribute('data-date');
            state.bookingForm.selectedTime = null;
            renderClientProfile();
          });
        });
      }

      // ---------- SLOT PICKER ----------
      function renderSlotPicker(lawyer) {
        const container = document.getElementById('slotPicker');
        if (!container) return;
        const selectedDate = state.bookingForm.selectedDate;
        if (!selectedDate) {
          container.innerHTML = `<div class="text-muted" style="font-size:0.85rem;">Pick a day first</div>`;
          return;
        }
        const slots = lawyer.availability?.slots || [];
        const bookedSlots = (lawyer.bookings || []).filter(b => b.date === selectedDate).map(b => b.time);

        let html = '';
        slots.forEach(time => {
          const isBooked = bookedSlots.includes(time);
          const isSelected = state.bookingForm.selectedTime === time;
          html += `<button class="slot-btn ${isSelected?'selected':''}" data-time="${esc(time)}" ${isBooked?'disabled':''}>${esc(formatTime12(time))}${isBooked?' (booked)':''}</button>`;
        });
        container.innerHTML = html || `<div class="text-muted" style="font-size:0.85rem;">No slots available</div>`;

        container.querySelectorAll('.slot-btn:not(:disabled)').forEach(btn => {
          btn.addEventListener('click', (e) => {
            state.bookingForm.selectedTime = e.currentTarget.getAttribute('data-time');
            renderClientProfile();
          });
        });
      }

      // ---------- BOOKING PAYMENT ----------
      function handleBookingPayment(lawyer) {
        const bf = state.bookingForm;
        bf.error = '';

        if (!bf.selectedDate || !bf.selectedTime) {
          bf.error = 'Please select a day and time slot.';
          renderClientProfile();
          return;
        }
        if (!bf.name.trim()) {
          bf.error = 'Please enter your name.';
          renderClientProfile();
          return;
        }
        if (!bf.email.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(bf.email.trim())) {
          bf.error = 'Please enter a valid email address.';
          renderClientProfile();
          return;
        }

        const freshLawyer = db.lawyers.find(l => l.id === lawyer.id);
        const alreadyBooked = (freshLawyer.bookings || []).some(b => b.date === bf.selectedDate && b.time === bf.selectedTime);
        if (alreadyBooked) {
          bf.error = 'That slot was just booked. Please choose another.';
          renderClientProfile();
          return;
        }

        const zoomLink = `https://zoom.us/j/${Math.floor(1000000000 + Math.random() * 9000000000)}`;
        const booking = {
          id: 'bk' + Date.now(),
          lawyerId: lawyer.id,
          date: bf.selectedDate,
          time: bf.selectedTime,
          clientName: bf.name.trim(),
          clientEmail: bf.email.trim(),
          issue: bf.issue.trim(),
          amount: lawyer.fee,
          zoomLink: zoomLink,
          paid: true,
        };

        if (!freshLawyer.bookings) freshLawyer.bookings = [];
        freshLawyer.bookings.push(booking);
        safeWrite(db);

        bf.success = true;
        bf.bookingDetails = {
          date: bf.selectedDate,
          time: bf.selectedTime,
          amount: lawyer.fee,
          zoomLink: zoomLink,
          email: bf.email.trim(),
        };
        renderClientProfile();
      }

      // ---------- RENDER: LAWYER DASHBOARD ----------
      function renderLawyerDashboard() {
        const lawyer = db.lawyers.find(l => l.id === state.selectedLawyerId);
        if (!lawyer) return;

        const tabs = ['profile', 'cases', 'testimonials', 'news', 'availability', 'bookings'];
        const tabLabels = { profile: 'Profile & fee', cases: 'High-profile cases', testimonials: 'Testimonials', news: 'News', availability: 'Availability', bookings: 'Bookings' };

        let html = `
          <div class="flex-between" style="margin-bottom:16px;">
            <h2>Lawyer Dashboard — ${esc(lawyer.name)}</h2>
            ${lawyer.verified ? '<span class="badge verified">Verified</span>' : '<span class="badge pending">Verification pending</span>'}
          </div>
          <div class="dashboard-tabs">
            ${tabs.map(t => `<button class="${state.dashboardTab===t?'active':''}" data-dtab="${t}">${tabLabels[t]}</button>`).join('')}
          </div>
          <div id="dashboardContent">
            ${renderDashboardTab(lawyer, state.dashboardTab)}
          </div>
        `;

        app.innerHTML = html;

        document.querySelectorAll('.dashboard-tabs button').forEach(btn => {
          btn.addEventListener('click', (e) => {
            state.dashboardTab = e.currentTarget.getAttribute('data-dtab');
            renderLawyerDashboard();
          });
        });

        attachDashboardHandlers(lawyer);
      }

        }
        if (tab === 'cases') {

          return `

              <div class="form-group"><label>Title</label><input id="caseTitle"></div>

              <div class="form-group"><label>Public source link (optional)</label><input id="caseSource" placeholder="https://..."></div>
              <button class="btn-primary" id="addCase">Add case</button>
            </div>
            <div class="card">
              <h3>Existing cases</h3>
              ${cases.length === 0 ? '<div class="empty">None added yet</div>' :

        if (tab === 'testimonials') {

          return `

            <div class="card" style="margin-bottom:16px;">
              <h3>Add testimonial</h3>
              <div class="form-group"><label>Client name / initials</label><input id="testClient"></div>
              <div class="form-group"><label>Rating (1-5)</label><input id="testRating" type="number" min="1" max="5"></div>
              <div class="form-group"><label>Text</label><textarea id="testText"></textarea></div>
              <button class="btn-primary" id="addTestimonial">Add testimonial</button>
            </div>
            <div class="card">
              <h3>Existing testimonials</h3>
              ${tests.length === 0 ? '<div class="empty">None added yet</div>' :

                  <div class="list-item">
                    <div>
                      <span class="stars">${'★'.repeat(t.rating)}</span> — ${esc(t.client)}<br>
                      <span class="text-muted" style="font-size:0.9rem;">"${esc(t.text)}"</span>
                    </div>
                    <button class="btn-danger" data-remove-testimonial="${esc(t.id)}">Remove</button>
                  </div>
                `).join('')
              }
            </div>
          `;
        }
        if (tab === 'news') {
          const news = lawyer.news || [];
          const sorted = [...news].sort((a,b) => (b.date || '').localeCompare(a.date || ''));
          return `
            <div class="card" style="margin-bottom:16px;">
              <h3>Add news / achievement</h3>
              <div class="form-group"><label>Headline</label><input id="newsHeadline"></div>
              <div class="form-group"><label>Date</label><input id="newsDate" type="date"></div>
              <button class="btn-primary" id="addNews">Add news</button>

            <div class="card">
              <h3>Existing news (newest first)</h3>

                  <div class="list-item">
                    <div><strong>${esc(n.headline)}</strong><br><span class="text-muted">${esc(n.date)}</span></div>

          return `

              <h3>Available weekdays</h3>
              <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;">

        }
        if (tab === 'bookings') {
          const bookings = (lawyer.bookings || []).filter(b => b.paid);
          const today = new Date().toISOString().slice(0,10);
          const upcoming = bookings.filter(b => b.date >= today).sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
          return `
            <div class="card">
              <h3>Upcoming bookings</h3>
              ${upcoming.length === 0 ? '<div class="empty">No upcoming bookings</div>' :
                upcoming.map(b => `
                  <div class="list-item" style="flex-direction:column; align-items:flex-start;">
                    <div><strong>${esc(formatDate(b.date))} · ${esc(formatTime12(b.time))}</strong></div>

                    <div class="text-muted" style="font-size:0.85rem;">Issue: ${esc(b.issue || '—')}</div>

                      <a href="${esc(b.zoomLink)}" target="_blank" rel="noopener" class="btn-outline" style="font-size:0.8rem; min-height:32px; padding:4px 12px;">Start Zoom</a>
                      <span class="badge verified">Paid</span>
                    </div>

        return '';
      }

      // ---------- DASHBOARD EVENT HANDLERS ----------
      function attachDashboardHandlers(lawyer) {
        const tab = state.dashboardTab;

        if (tab === 'profile') {
          document.getElementById('saveProfile')?.addEventListener('click', () => {
            const name = document.getElementById('dashName').value.trim();
            const city = document.getElementById('dashCity').value.trim();
            const areasRaw = document.getElementById('dashAreas').value.trim();
            const years = parseInt(document.getElementById('dashYears').value, 10);
            const fee = parseInt(document.getElementById('dashFee').value, 10);
            const bar = document.getElementById('dashBar').value.trim();
            const bio = document.getElementById('dashBio').value.trim();

            if (!name || !city) { alert('Name and city are required.'); return; }
            if (isNaN(years) || years < 0) { alert('Enter valid years.'); return; }
            if (isNaN(fee) || fee < 0) { alert('Enter valid fee.'); return; }

            lawyer.name = name;
            lawyer.city = city;
            lawyer.practiceAreas = areasRaw.split(',').map(s => s.trim()).filter(Boolean);
            lawyer.years = years;
            lawyer.fee = fee;
            lawyer.barNumber = bar;
            lawyer.bio = bio;
            safeWrite(db);
            renderLawyerDashboard();
            populateLawyerSelect();
            alert('Profile saved.');
          });
        }

        if (tab === 'cases') {
          document.getElementById('addCase')?.addEventListener('click', () => {
            const title = document.getElementById('caseTitle').value.trim();
            const year = parseInt(document.getElementById('caseYear').value, 10);
            const desc = document.getElementById('caseDesc').value.trim();
            const source = document.getElementById('caseSource').value.trim();
            if (!title || isNaN(year)) { alert('Title and year required.'); return; }
            if (source && !/^https?:\/\//.test(source)) { alert('Source must start with http:// or https://'); return; }
            if (!lawyer.cases) lawyer.cases = [];
            lawyer.cases.push({ id: 'c' + Date.now(), title, year, description: desc, source });
            safeWrite(db);
            renderLawyerDashboard();
          });
          document.querySelectorAll('[data-remove-case]').forEach(btn => {
            btn.addEventListener('click', (e) => {
              const id = e.currentTarget.getAttribute('data-remove-case');
              lawyer.cases = lawyer.cases.filter(c => c.id !== id);
              safeWrite(db);
              renderLawyerDashboard();
            });
          });
        }

        if (tab === 'testimonials') {
          document.getElementById('addTestimonial')?.addEventListener('click', () => {
            const client = document.getElementById('testClient').value.trim();
            const rating = parseInt(document.getElementById('testRating').value, 10);
            const text = document.getElementById('testText').value.trim();
            if (!client || !text) { alert('Client and text required.'); return; }
            if (isNaN(rating) || rating < 1 || rating > 5) { alert('Rating must be 1-5.'); return; }
            if (!lawyer.testimonials) lawyer.testimonials = [];
            lawyer.testimonials.push({ id: 't' + Date.now(), client, rating, text });
            safeWrite(db);
            renderLawyerDashboard();
          });
          document.querySelectorAll('[data-remove-testimonial]').forEach(btn => {
            btn.addEventListener('click', (e) => {
              const id = e.currentTarget.getAttribute('data-remove-testimonial');
              lawyer.testimonials = lawyer.testimonials.filter(t => t.id !== id);
              safeWrite(db);
              renderLawyerDashboard();
            });
          });
        }

        if (tab === 'news') {
          document.getElementById('addNews')?.addEventListener('click', () => {
            const headline = document.getElementById('newsHeadline').value.trim();
            const date = document.getElementById('newsDate').value;
            if (!headline || !date) { alert('Headline and date required.'); return; }
            if (!lawyer.news) lawyer.news = [];
            lawyer.news.push({ id: 'n' + Date.now(), headline, date });
            safeWrite(db);
            renderLawyerDashboard();
          });
          document.querySelectorAll('[data-remove-news]').forEach(btn => {
            btn.addEventListener('click', (e) => {
              const id = e.currentTarget.getAttribute('data-remove-news');
              lawyer.news = lawyer.news.filter(n => n.id !== id);
              safeWrite(db);
              renderLawyerDashboard();
            });
          });
        }

        if (tab === 'availability') {
          document.querySelectorAll('[data-toggle-weekday]').forEach(btn => {
            btn.addEventListener('click', (e) => {
              const idx = parseInt(e.currentTarget.getAttribute('data-toggle-weekday'), 10);
              if (!lawyer.availability) lawyer.availability = { weekdays: [], slots: [] };
              const wd = lawyer.availability.weekdays;
              const pos = wd.indexOf(idx);
              if (pos === -1) wd.push(idx); else wd.splice(pos, 1);
              safeWrite(db);
              renderLawyerDashboard();
            });
          });
          document.getElementById('saveAvailability')?.addEventListener('click', () => {
            const slotsRaw = document.getElementById('dashSlots').value;
            const slots = slotsRaw.split(',').map(s => s.trim()).filter(s => /^([01]?\d|2[0-3]):[0-5]\d$/.test(s));
            lawyer.availability.slots = slots;
            safeWrite(db);
            renderLawyerDashboard();
            alert('Availability saved.');
          });
        }
      }

      // ---------- MODE SWITCHING ----------
      function setMode(mode) {
        state.mode = mode;
        if (mode === 'client') {
          modeClientBtn.classList.add('active');
          modeLawyerBtn.classList.remove('active');
          lawyerLoginWrap.classList.add('hidden');
          state.currentLawyerId = null;
          renderClientHome();
        } else {
          modeClientBtn.classList.remove('active');
          modeLawyerBtn.classList.add('active');
          lawyerLoginWrap.classList.remove('hidden');
          populateLawyerSelect();
          state.selectedLawyerId = lawyerSelect.value || db.lawyers[0].id;
          renderLawyerDashboard();
        }
      }

      // ---------- INIT ----------
      function init() {
        populateLawyerSelect();
        lawyerSelect.addEventListener('change', (e) => {
          state.selectedLawyerId = e.target.value;
          renderLawyerDashboard();
        });

        modeClientBtn.addEventListener('click', () => setMode('client'));
        modeLawyerBtn.addEventListener('click', () => setMode('lawyer'));

        setMode('client');
      }

      init();
    })();
  </script>
</body>
</html>
